- id: rejected
  source: UI/Weebo/memory/rejected_proposals.yaml
  role: Rejected decision memory for dead-path and anti-loop protection.
  owns:
    - rejected directions
    - known dead paths
    - anti-loop reminders
    - blocked proposal memory
  does_not_own:
    - approved decisions
    - new rejection authority
    - CE-OS source authority
    - autonomous prevention beyond reporting
    - final human decision-making
  keywords:
    - rejected
    - dead paths
    - anti-loop
    - Jarvis not yet
    - autonomous edits blocked
    - model training blocked
    - decisions
  summary: >
    Source-grounded summary of rejected proposal memory. This card tells Weebo
    to surface rejected directions such as premature Jarvis work, autonomous
    edits, and model training before suggesting related work again. The card is
    summary only; if it conflicts with UI/Weebo/memory/rejected_proposals.yaml,
    the source file remains authoritative.
