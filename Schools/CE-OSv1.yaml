              required_measurements:
                - contact_pressure
                - relative_motion
                - material_pair
                - cycle_count
                - observed_wear_depth
              assumptions:
                - contact_interface_identified
              constraints:
                - wear_risk_does_not_equal_long_term_durability
              loss_terms:
                - material_loss
                - surface_deformation
              evidence_state: candidate_operator
              prohibited_outputs:
                - long_term_durability
                - validated_restraint_safety

            strap_creep_operator:
