          domain_taxonomy:

            mass_centric:
              code: MC
              role: mass_load_displacement_domain
              description: >
                Domains primarily governed through matter, inertia, load, pressure,
                friction, displacement, structural contact, and material motion.
              transfer_mode: transfer
              prohibited_collapse:
