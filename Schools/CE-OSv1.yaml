            - Lexicon.yaml
            - Physics.yaml
            - Interface.yaml
            - Engine.yaml
            - Governance.yaml
            - Prototype.yaml

          downstream:
            - measurement_logs
            - anomaly_reports
            - maintenance_records
            - validation_requests
            - shutdown_records

          runtime_states:
            idle:
              meaning: system present but not under active test or operation

            mockup_measurement:
              meaning: candidate geometry or subsystem is being measured

            controlled_test:
              meaning: bounded test condition is active

            environmental_hold:
              meaning: external condition blocks or pauses activity

            anomaly_hold:
              meaning: observed anomaly blocks continued transition

            maintenance:
              meaning: inspection repair adjustment or replacement is active

            shutdown:
              meaning: system is inactive by stop condition or operator decision

          transition_schema:
            required_fields:
