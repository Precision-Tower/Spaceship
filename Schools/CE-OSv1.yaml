                - boundary_area
              assumptions:
                - boundary_conditions_defined
                - material_path_identified
              constraints:
                - heat_transfer_rate_is_condition_bound
                - thermal_gradient_does_not_validate_fluid_circulation
              loss_terms:
                - radiation_loss
                - convection_loss
                - contact_resistance
              evidence_state: candidate_operator
              prohibited_outputs:
                - validated_thermal_performance

            fluid_drag_operator:
              role: estimate fluid drag against an object under defined flow conditions
              domain: FD
              operation_type: transfer_operator
              input_variables:
                - fluid_density
                - relative_velocity
                - projected_area
