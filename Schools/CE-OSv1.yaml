                - readiness_claim

            measured_to_bounded:
              from_state: measured_operator
              to_state: bounded_operator
              trigger_condition: repeated_measurements_define_condition_bound
              required_measurements:
                - repeat_count
                - boundary_conditions
                - variance_or_uncertainty
                - anomaly_records
              hold_conditions:
                - single_trial_only
                - uncontrolled_environment
                - missing_negative_results
              prohibited_claims:
                - broad_operating_envelope
                - validated_performance

            bounded_to_governance_review:
              from_state: bounded_operator
              to_state: governance_review_required
              trigger_condition: output_may_support_claim_promotion
              required_measurements:
                - bounded_test_records
                - anomaly_records
                - claim_text
                - operating_envelope
              hold_conditions:
                - unsupported_claim_language
                - missing_evidence_state
              prohibited_claims:
                - self_validation_by_Engine
                - automatic_claim_promotion

          unresolved:
            - final_unit_normalization
            - complete_operator_library
            - measurement_record_schema_alignment
            - Governance_yaml_not_yet_rebuilt
            - Runtime_yaml_not_yet_unlocked
            - operator_threshold_values_not_set
            - margin_thresholds_not_validated

          contradiction_register:
            - computable_operator_does_not_equal_validated_claim
            - scalar_margin_does_not_replace_causal_accounting
            - positive_margin_does_not_equal_operational_readiness
            - measured_once_does_not_equal_bounded_operation
            - bounded_operator_does_not_equal_broad_operating_envelope
            - cross_domain_operator_requires_Interface_bridge
            - variable_calculation_does_not_define_variable_meaning

          prohibited_claims:
            - Engine_validates_claims
            - operator_success_equals_causal_completeness
            - computed_margin_equals_safety
            - model_output_equals_operational_readiness
            - calculation_equals_measurement
            - measurement_equals_validation
            - bridge_operator_equals_bridge_authority
            - efficiency_claim_without_measured_input_output
            - safe_payload
            - seaworthiness
            - reserve_buoyancy
            - validated_stability
            - validated_restraint_safety
            - long_term_durability

          recovery:
            reconstructable_from:
              - Structure.yaml
              - CE-OS.yaml
              - Physics.yaml
              - Lexicon.yaml
              - Interface.yaml
