              constraints:
                - creep_observation_does_not_validate_restraint_safety
              loss_terms:
                - elongation
                - fiber_damage
                - abrasion
              evidence_state: candidate_operator
              prohibited_outputs:
                - validated_restraint_safety
                - long_term_durability

            measurement_capture_operator:
              role: convert observation into structured variable record with context
              domain: validation_support
              operation_type: measurement_operator
              input_variables:
                - observed_value
                - measurement_method
                - unit
                - test_condition
                - timestamp
              output_variables:
                - measurement_record
                - uncertainty_note
              required_measurements:
                - observed_value
                - method
                - condition
              assumptions:
                - observation_context_recorded
              constraints:
                - measurement_record_does_not_self_promote_to_validation
              loss_terms:
                - measurement_uncertainty
                - instrument_error
                - sampling_error
              evidence_state: candidate_operator
              prohibited_outputs:
                - validation_claim
                - operational_readiness

          engineering_formats:

            buoyancy_payload_support_format:
              role: compose buoyancy force and margin checks for flotation support analysis
              composed_operators:
                - buoyancy_force_operator
                - buoyancy_margin_operator
              required_variables:
                - displaced_volume
                - fluid_density
                - object_mass
                - loaded_weight
                - submerged_volume
                - freeboard
              output_records:
                - buoyant_force
                - flotation_margin
                - unresolved_load_cases
              required_measurements:
                - measured_displacement_volume
                - measured_loaded_weight
                - waterline_z
                - freeboard
              unresolved:
                - dynamic_wave_behavior
                - uneven_load_distribution
                - flooding_or_leakage_state
              prohibited_claims:
                - reserve_buoyancy
                - safe_payload
                - seaworthiness
                - validated_stability

            electrical_motor_output_format:
              role: compose electrical input and mechanical output checks for motor-like conversion
              composed_operators:
                - electrical_power_operator
                - electrical_to_mechanical_operator
                - torque_power_operator
              required_variables:
                - input_voltage
                - input_current
                - output_torque
                - output_speed
                - temperature_rise
              output_records:
                - electrical_input_power
                - mechanical_output_power
                - loss_gap
              required_measurements:
                - voltage_under_load
                - current_under_load
                - torque_under_load
                - rpm_under_load
                - temperature_rise
              unresolved:
                - efficiency_curve
                - duty_cycle_boundary
                - thermal_limit
              prohibited_claims:
                - validated_efficiency
                - validated_output_power
                - operational_readiness

            hydraulic_actuation_format:
              role: compose hydraulic pressure flow and mechanical output checks
              composed_operators:
                - hydraulic_force_operator
              required_variables:
                - hydraulic_pressure
                - actuator_area
                - flow_rate
                - displacement
                - leakage
              output_records:
                - mechanical_output_force
                - displacement_rate
                - leakage_note
              required_measurements:
                - pressure
                - actuator_area
                - flow_rate
                - stroke_displacement
                - leak_rate
              unresolved:
                - pressure_drop
                - seal_loss
                - load_hold_behavior
              prohibited_claims:
                - safe_payload
                - validated_lift_capacity
                - validated_hold_capacity

            HDPE_drum_restraint_format:
              role: compose flotation contact restraint and degradation operators for drum restraint analysis
              composed_operators:
                - buoyancy_force_operator
                - buoyancy_margin_operator
                - abrasion_wear_operator
                - strap_creep_operator
              required_variables:
                - displaced_volume
                - submerged_volume
                - buoyant_force
                - cradle_load
                - strap_tension
                - contact_pressure
                - cycle_count
                - relative_motion
              output_records:
                - buoyant_uplift_record
                - restraint_load_path_record
                - wear_risk
                - creep_risk
                - unresolved_restraint_modes
              required_measurements:
                - drum_mass
                - displacement_volume
                - strap_tension
                - side_stop_load
                - end_stop_load
                - contact_wear
                - cyclic_motion
              unresolved:
                - float_out_risk
                - drum_roll_or_slide
                - cyclic_wave_loading
                - inspection_visibility
                - replacement_access
              prohibited_claims:
                - validated_restraint_safety
                - reserve_buoyancy
                - long_term_durability
                - seaworthiness
                - operational_readiness

          state_transition_templates:

            candidate_to_measured:
              from_state: candidate_operator
              to_state: measured_operator
              trigger_condition: required_measurements_recorded_with_context
              required_measurements:
                - input_values
                - output_values
                - measurement_method
                - test_condition
              hold_conditions:
                - missing_units
                - missing_test_context
                - missing_repeat_count
              prohibited_claims:
