              source: Structure.yaml
              target: Lexicon.yaml
              purpose: >
                Allow Structure to route Lexicon without becoming semantic authority.
              allowed_transfers:
                - Structure_may_list_Lexicon_as_semantic_authority
                - Lexicon_may_reference_Structure_for_recovery_route
              blocked_transfers:
                - Structure_defines_terms
                - Structure_controls_aliases
                - Structure_mutates_semantic_identity
              drift_checks:
                - if_definitions_appear_in_Structure_then_move_to_Lexicon
                - if_Lexicon_routes_repository_topology_then_move_to_Structure
              required_visible_fields:
                - Lexicon_file_route
                - semantic_authority_pointer
              recovery_pointer:
                - Structure.yaml
                - Lexicon.yaml
              unresolved: []

          cross_domain_bridge_templates:

            electrical_to_mechanical:
              source_domain: EC
              target_domain: ME
              purpose: electrical_input_to_mechanical_output_mapping
              allowed_transfers:
                - voltage_current_to_torque_speed_variable_binding
                - electrical_input_state_to_mechanical_output_state
              blocked_transfers:
                - electrical_domain_becomes_mechanical_domain
                - efficiency_claim_without_measurement
                - output_power_claim_without_load_test
              required_visible_fields:
                - input_voltage
                - input_current
                - output_torque
                - output_speed
                - temperature_rise
                - losses
              unresolved:
                - measured_efficiency_curve
                - load_condition_records

            mechanical_to_electrical:
              source_domain: ME
              target_domain: EC
              purpose: mechanical_input_to_electrical_output_mapping
              allowed_transfers:
                - torque_speed_to_voltage_current_variable_binding
              blocked_transfers:
                - rotational_motion_equals_validated_generation
                - output_stability_claim_without_measurement
              required_visible_fields:
                - input_torque
                - input_speed
                - output_voltage
                - output_current
                - load_condition
                - losses
              unresolved:
                - generator_curve
                - output_stability_records

            hydraulic_to_mechanical:
              source_domain: FH
              target_domain: ME
              purpose: pressure_flow_to_force_displacement_mapping
              allowed_transfers:
                - hydraulic_pressure_to_linear_force
                - flow_rate_to_displacement_rate
              blocked_transfers:
                - pressure_rating_equals_output_force_without_geometry
                - hydraulic_capacity_equals_validated_load_capacity
              required_visible_fields:
                - hydraulic_pressure
                - flow_rate
                - actuator_area
                - displacement
                - leakage
                - mechanical_output_force
              unresolved:
                - seal_loss_records
                - pressure_drop_records

            mechanical_to_hydraulic:
              source_domain: ME
              target_domain: FH
              purpose: mechanical_input_to_fluid_pressure_or_flow_mapping
              allowed_transfers:
                - shaft_power_to_pressure_flow_variable_binding
              blocked_transfers:
                - motor_power_equals_pump_output_without_curve
                - pump_presence_equals_validated_flow_capacity
              required_visible_fields:
                - input_torque
                - input_speed
                - output_pressure
                - flow_rate
                - leakage
                - losses
              unresolved:
                - pump_curve
                - cavitation_boundary

            thermal_to_fluid:
              source_domain: TE
              target_domain: FD
              purpose: thermal_state_change_to_fluid_state_change_mapping
              allowed_transfers:
                - temperature_gradient_to_density_pressure_or_flow_change
                - phase_change_to_fluid_volume_or_pressure_change
              blocked_transfers:
                - heat_presence_equals_flow_prediction
                - thermal_gradient_equals_validated_circulation
              required_visible_fields:
                - temperature_gradient
                - fluid_density
                - viscosity
                - flow_rate
                - pressure
                - boundary_conditions
              unresolved:
                - measured_convection_path
                - thermal_loss_path

            fluid_to_structural:
              source_domain: FD
              target_domain: ME
              purpose: fluid_load_to_structural_load_mapping
              allowed_transfers:
                - wave_drag_pressure_or_buoyancy_to_structural_load
              blocked_transfers:
                - observed_floatation_equals_validated_stability
                - calm_water_behavior_equals_sea_state_capability
              required_visible_fields:
                - wave_height
                - current_speed
                - pressure_distribution
                - contact_area
                - structural_deflection
                - attachment_load
              unresolved:
                - cyclic_loading_records
                - impact_loading_records

            magnetic_to_mechanical:
              source_domain: FX
              target_domain: ME
              purpose: magnetic_field_behavior_to_mechanical_force_or_motion_mapping
              allowed_transfers:
                - magnetic_force_to_mechanical_load_or_motion_variable_binding
              blocked_transfers:
                - magnetic_alignment_equals_free_work
                - field_presence_equals_validated_force_output
              required_visible_fields:
                - magnetic_flux
                - field_strength
                - gap_distance
                - coupling_distance
                - mechanical_force
                - losses
              unresolved:
                - force_distance_curve
                - magnetic_saturation_boundary

            electromagnetic_to_thermal:
              source_domain: EMW
              target_domain: TE
              purpose: radiation_absorption_to_thermal_state_change_mapping
              allowed_transfers:
                - radiation_input_to_temperature_change
                - absorption_to_heat_flux_variable_binding
              blocked_transfers:
                - radiation_presence_equals_heating_prediction
                - absorbed_energy_equals_uniform_temperature_change
              required_visible_fields:
                - frequency
                - wavelength
                - amplitude_or_intensity
                - material_absorptivity
                - temperature_change
                - heat_loss_path
              unresolved:
                - absorption_spectrum
                - thermal_distribution_record

          pressure_register:

            semantic_drift:
              pressure_source:
                - uncontrolled_aliases
                - shorthand_terms
                - repeated_paraphrase_of_same_concept
              drift_risk: high
              authority_collision_risk:
                - Lexicon_vs_Physics
                - Lexicon_vs_Interface
              unlock_threshold:
                - same_term_used_with_multiple_meanings
                - new_domain_code_appears_without_definition
              recommended_action:
                - create_or_update_Lexicon_record

            bridge_growth:
              pressure_source:
                - repeated_cross_domain_mappings
                - bridge_required_without_contract
                - blocked_transfer_logic_appearing_outside_Interface
              drift_risk: high
              authority_collision_risk:
                - Physics_vs_Interface
              unlock_threshold:
                - same_bridge_pattern_used_more_than_once
                - bridge_summary_repeated_in_multiple_files
              recommended_action:
                - create_Interface_bridge_record

            governance_pressure:
              pressure_source:
                - validation_language
                - performance_claims
                - safety_claims
                - readiness_claims
              drift_risk: medium
              authority_collision_risk:
                - Interface_vs_Governance
                - Physics_vs_Governance
              unlock_threshold:
                - evidence_promotion_or_prohibited_claim_language_repeats
              recommended_action:
                - create_or_update_Governance_record

            engineering_pressure:
              pressure_source:
                - repeated_variable_use
                - operator_patterns
                - margin_tracking
                - measurement_records
              drift_risk: medium
              authority_collision_risk:
                - Physics_vs_Engine
              unlock_threshold:
                - variable_requires_computable_operator_or_margin_logic
              recommended_action:
                - create_or_update_Engine_record

          unresolved:
            - complete_bridge_records_for_future_cross_domain_interactions
            - final_Governance_boundary_when_Governance_yaml_is_rebuilt
            - Engine_boundary_when_Engine_yaml_is_rebuilt
            - Prototype_boundary_when_Prototype_yaml_is_rebuilt
            - Runtime_boundary_if_operational_state_tracking_reappears

          contradiction_register:
            - bridge_needed_does_not_mean_bridge_validated
            - translation_boundary_does_not_mean_domain_equivalence
            - repeated_bridge_pattern_does_not_create_authority
            - semantic_alias_does_not_replace_primary_definition
            - physical_mapping_does_not_validate_performance
            - causal_distinction_reference_does_not_transfer_CE_OS_authority
            - topology_route_does_not_create_bridge_contract

          prohibited_claims:
            - interface_validates_claims
            - bridge_contract_proves_physical_model
            - cross_domain_mapping_equals_efficiency
            - translation_equals_equivalence
            - blocked_transfer_equals_disproof
            - bridge_registry_equals_topology
            - interface_replaces_governance
            - interface_replaces_lexicon
            - interface_replaces_physics
            - interface_replaces_CE_OS

          recovery:
            reconstructable_from:
              - Structure.yaml
              - CE-OS.yaml
              - Physics.yaml
              - Lexicon.yaml
              - prior_Interface_file
              - phase_3_boundary_notes

            recovery_requirements:
              - every_bridge_has_one_record
              - every_bridge_points_to_source_and_target_authorities
              - every_blocked_transfer_remains_visible
              - every_drift_check_has_owner_authority
              - every_cross_domain_mapping_preserves_domain_identity
              - unresolved_items_remain_visible

            compression_rule:
              - one_bridge_one_record
              - pointers_over_restatement
              - bridge_logic_in_Interface
              - topology_out
              - definitions_out
              - objects_out
              - validation_out
              - blocked_transfers_visible
              - drift_checks_visible
    Engine:
      source_file: Engine.yaml
      source_path: /mnt/data/Engine.yaml
      source_sha256: fd52c6b6ba1de0ba7754da2e71152bff7e34d730963df18e71741563399cf78b
      source_bytes: 23623
      recovery_rule: raw_source_snapshot_embedded_below_is_authority_recovery_for_this_lane
      raw_source_snapshot: |
        Engine:
          file: Engine.yaml
          role: computable_operator_format_and_state_registry
          authority: reusable_engineering_logic_measurement_transforms_and_margin_structure
          status: phase_5_replacement_draft

          caution:
            note: >
              Engine.yaml defines reusable operators, engineering formats, margin logic,
              measurement transforms, and state-transition templates. Engine does not define
              terms, own physical objects, govern bridges, validate claims, replace causal
              doctrine, or assert operational readiness.

          owns:
            - reusable_operators
            - engineering_formats
            - computable_variable_relationships
            - margin_logic
            - measurement_transforms
            - state_transition_templates
            - calculation_readiness_requirements
            - operator_input_output_schemas
            - unresolved_computation_register

          does_not_own:
            - causal_definitions
            - semantic_identity
            - physical_object_registry
            - bridge_contracts
            - repository_topology
            - claim_validation
            - prototype_candidate_geometry
            - operational_readiness
            - replacement_physics_claims

          upstream:
            - Structure.yaml
            - CE-OS.yaml
            - Physics.yaml
            - Lexicon.yaml
            - Interface.yaml

          downstream:
            - Prototype.yaml
            - Governance.yaml
            - measurement_plans
            - validation_requests
            - future_Runtime.yaml

          ce_os_pointer:
            authority_source: CE-OS.yaml
            governs:
              - interaction_definition
              - causal_accounting_order
              - transfer_vs_propagation
              - operational_validity_vs_causal_completeness
              - scalar_compression_warning
            rule: >
              Engine may compress interaction structure into computable operators and scalar
              margins, but CE-OS governs causal doctrine. Operator success does not imply
              causal completeness or validation.

          physics_pointer:
            authority_source: Physics.yaml
            governs:
              - physical_domains
              - physical_objects
              - attached_variables
              - interaction_topology
              - measurement_unlocks
            rule: >
              Engine may compute with variables and formats referenced from Physics, but
              Physics owns the physical domain and object registry.

          lexicon_pointer:
            authority_source: Lexicon.yaml
            governs:
              - term_definitions
              - aliases
              - admissible_uses
              - mutation_risks
            rule: >
              Engine may use controlled terms and aliases, but Lexicon owns semantic identity.

          interface_pointer:
            authority_source: Interface.yaml
            governs:
              - bridge_contracts
              - blocked_transfers
              - translation_boundaries
              - drift_checks
            rule: >
              Cross-domain operators require Interface bridge records or explicit bridge-required
              flags. Engine may not create bridge authority by computation alone.

          evidence_states:
            candidate_operator:
              meaning: operator structure exists but has not been checked against measured data
            measured_operator:
              meaning: operator inputs and outputs have measurement records in stated conditions
            bounded_operator:
              meaning: operator is limited to a documented range or envelope
            governance_review_required:
              meaning: operator output could support a claim and must route to Governance before promotion

          operator_schema:
            required_fields:
              - name
              - role
              - domain
              - input_variables
              - output_variables
              - operation_type
              - required_measurements
              - assumptions
              - constraints
              - loss_terms
              - evidence_state
              - prohibited_outputs
            optional_fields:
              - source_domain
              - target_domain
              - interface_bridge_required
              - failure_modes
              - margin_thresholds
              - units
              - test_method
              - recovery_pointer

          format_schema:
            required_fields:
              - name
              - role
              - composed_operators
              - required_variables
              - output_records
              - required_measurements
              - unresolved
              - prohibited_claims
            optional_fields:
              - domain
              - bridge_records
              - margin_dashboard
              - state_transitions
              - evidence_state

          state_transition_schema:
            required_fields:
              - name
              - from_state
              - to_state
              - trigger_condition
              - required_measurements
              - hold_conditions
              - prohibited_claims
            optional_fields:
              - operator_dependency
              - recovery_action
              - shutdown_condition
              - governance_review_required

          operator_classes:

            margin_operators:
              role: compare_measured_or_modeled_capacity_against_load_or_demand
              examples:
                - buoyancy_margin_operator
                - power_margin_operator
                - containment_margin_operator
                - structural_margin_operator
                - thermal_margin_operator

            transfer_operators:
              role: map non-field load pressure momentum displacement or state passage
              examples:
                - load_transfer_operator
                - pressure_transfer_operator
                - fluid_flow_operator
                - torque_power_operator
                - hydraulic_force_operator

            propagation_operators:
              role: map field-centric distributed propagation or gradient behavior
              examples:
                - electromagnetic_wave_operator
                - thermal_gradient_operator
                - inductive_coupling_operator
                - radiation_absorption_operator

            bridge_operators:
              role: map controlled cross-domain transformations with Interface boundary rules
              examples:
                - electrical_to_mechanical_operator
                - mechanical_to_hydraulic_operator
                - hydraulic_to_mechanical_operator
                - electromagnetic_to_thermal_operator

            degradation_operators:
              role: track loss creep wear fatigue corrosion thermal damage or state degradation
              examples:
                - abrasion_wear_operator
                - strap_creep_operator
                - fatigue_cycle_operator
                - corrosion_exposure_operator
                - thermal_rise_operator

            measurement_operators:
              role: convert observations into structured variable records
              examples:
                - measurement_capture_operator
                - uncertainty_bounds_operator
                - repeatability_operator
                - anomaly_register_operator

          reusable_operators:

            buoyancy_force_operator:
              role: compute or estimate buoyant force from displaced fluid conditions
              domain: BC
              operation_type: transfer_operator
              input_variables:
                - displaced_volume
                - fluid_density
                - gravitational_acceleration
              output_variables:
                - buoyant_force
              required_measurements:
                - displaced_volume
                - fluid_density
                - object_mass
                - submerged_volume
              assumptions:
                - fluid_density_known_or_measured
                - displaced_volume_geometry_valid_for_test_condition
              constraints:
                - calm_water_result_does_not_validate_sea_state_behavior
                - buoyant_force_does_not_equal_reserve_buoyancy_without_margin_analysis
              loss_terms:
                - leakage
                - trapped_water
                - deformation
              evidence_state: candidate_operator
              prohibited_outputs:
                - reserve_buoyancy_claim
                - seaworthiness_claim
                - validated_stability_claim

            buoyancy_margin_operator:
              role: compare buoyant support against loaded weight under stated conditions
              domain: BC
              operation_type: margin_operator
              input_variables:
                - buoyant_force
                - loaded_weight
                - safety_factor_or_margin_threshold
              output_variables:
                - flotation_margin
                - overload_gap
              required_measurements:
                - buoyant_force
                - loaded_weight
                - waterline_z
                - freeboard
              assumptions:
                - load_case_defined
                - water_condition_defined
              constraints:
                - positive_margin_does_not_validate_system_stability
                - margin_is_condition_bound
              loss_terms:
                - dynamic_wave_load
                - water_ingress
                - uneven_load_distribution
              evidence_state: candidate_operator
              prohibited_outputs:
                - safe_payload
                - validated_stability
                - operational_readiness

            torque_power_operator:
              role: compute shaft power relationship from torque and angular velocity
              domain: MA
              operation_type: transfer_operator
              input_variables:
                - torque
                - angular_velocity
              output_variables:
                - shaft_power
              required_measurements:
                - torque
                - rpm
              assumptions:
                - torque_and_speed_measured_at_same_shaft_condition
              constraints:
                - shaft_power_does_not_equal_available_output_after_losses
              loss_terms:
                - bearing_loss
                - coupling_loss
                - heat_generation
              evidence_state: candidate_operator
              prohibited_outputs:
                - validated_output_power
                - validated_duty_cycle

            hydraulic_force_operator:
              role: compute mechanical force from hydraulic pressure and actuator area
              domain: FH
              operation_type: bridge_operator
              source_domain: FH
              target_domain: ME
              interface_bridge_required: hydraulic_to_mechanical
              input_variables:
                - hydraulic_pressure
                - actuator_area
              output_variables:
                - mechanical_output_force
              required_measurements:
                - pressure
                - actuator_area
                - leakage
                - displacement
              assumptions:
                - actuator_geometry_known
                - pressure_applied_at_effective_area
              constraints:
                - pressure_rating_does_not_equal_validated_load_capacity
              loss_terms:
                - seal_loss
                - pressure_drop
                - friction
              evidence_state: candidate_operator
              prohibited_outputs:
                - validated_lift_capacity
                - safe_payload

            electrical_power_operator:
              role: compute electrical power from voltage and current under stated condition
              domain: EC
              operation_type: transfer_operator
              input_variables:
                - voltage
                - current
              output_variables:
                - electrical_power
              required_measurements:
                - voltage
                - current
                - measurement_condition
              assumptions:
                - voltage_and_current_recorded_under_same_load_condition
              constraints:
                - input_power_does_not_equal_useful_output_power_without_bridge_and_loss_accounting
              loss_terms:
                - heat_generation
                - voltage_drop
                - internal_resistance
              evidence_state: candidate_operator
              prohibited_outputs:
                - validated_runtime
                - validated_safe_output

            electrical_to_mechanical_operator:
              role: map electrical input variables to mechanical output variables through a conversion component
              domain: cross_domain
              operation_type: bridge_operator
              source_domain: EC
              target_domain: ME
              interface_bridge_required: electrical_to_mechanical
              input_variables:
                - input_voltage
                - input_current
              output_variables:
                - output_torque
                - output_speed
