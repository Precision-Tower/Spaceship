    BAS:
      source_file: BAS
      source_path: /mnt/data/BAS
      source_sha256: b833ee61805eaf70494d42c280fb597fc87a9147d025210721dab252c9321af0
      source_bytes: 15812
      recovery_rule: raw_source_snapshot_embedded_below_is_authority_recovery_for_this_lane
      raw_source_snapshot: |-
        BAS_bench_phase_v1:
          prototype_architecture:
            purpose: "Expose whether one short-stroke actuator can repeat a bounded hydrostatic cycle."
            operating_boundary:
              scale: "bench-scale"
              depth: "shallow only"
              actuator_count: 1
              objective: "state repeatability, not output power"

            chamber_geometry_candidates:
              simple_cylinder:
                purpose: "Repeatable volume, easy sealing, easy observation."
                failure_modes: ["end-cap leakage", "trapped air inconsistency", "wall flex"]
                tolerance_sensitivity: "medium"
                maintenance_burden: "low"

              rectangular_clear_chamber:
                purpose: "Visualize ingress, bubbles, valve behavior."
                failure_modes: ["corner leakage", "uneven pressure loading", "seal creep"]
                tolerance_sensitivity: "high"
                maintenance_burden: "medium"

              bottle_or_tube_float:
                purpose: "Lowest-cost buoyancy chamber for early tests."
                failure_modes: ["poor valve integration", "geometry inconsistency", "mount flex"]
                tolerance_sensitivity: "medium"
                maintenance_burden: "low"

            guide_geometry:
              vertical_dual_rail_slider:
                purpose: "Constrain motion and expose side-loading."
                failure_modes: ["binding", "rail misalignment", "friction drift"]
                tolerance_sensitivity: "high"
                maintenance_burden: "medium"

              single_center_rod:
                purpose: "Simpler construction."
                failure_modes: ["rotation", "wobble", "seal/guide wear"]
                tolerance_sensitivity: "medium"
                maintenance_burden: "low"

            valve_candidates:
              gravity_flap:
                purpose: "Passive ingress and closure."
                failure_modes: ["flutter", "delayed seating", "edge leakage"]
                tolerance_sensitivity: "high"
                maintenance_burden: "low"

              hinged_shutter:
                purpose: "More defined open/close geometry."
                failure_modes: ["hinge slack", "debris jam", "impact rebound"]
                tolerance_sensitivity: "medium-high"
                maintenance_burden: "medium"

              sliding_gate:
                purpose: "Endpoint-triggered state separation."
                failure_modes: ["binding", "seal drag", "mistimed actuation"]
                tolerance_sensitivity: "high"
                maintenance_burden: "medium-high"

            linkage_output_geometry:
              initial_mode: "No useful output extraction during first tests."
              later_mode: "Light crank or pointer arm only after free oscillation is characterized."
              reason: "Output load can hide whether the core buoyancy cycle is stable."

            ballast_transfer_path:
              ingress_path: "Valve opening into chamber."
              restoration_path: "Pump outlet removes chamber water to surrounding reservoir or external catch."
              critical_issue: "Ingress and restoration paths must not unintentionally short-circuit each other."

            pump_placement:
              preferred: "Fixed externally to frame, connected by flexible tubing."
              avoid: "Pump mounted on moving chamber unless vibration effects are being tested."
              risk: "Pump vibration may unseat valves or add side-load."

            sealing_assumptions:
              allowed: "bounded leakage"
              not_allowed: "perfect sealing"
              governing_condition: "Q_pump must exceed Q_leak with margin under test depth."

            trigger_mechanisms:
              top_trigger: ["mechanical stop", "cam tab", "flap release contact"]
              bottom_trigger: ["flap seating by gravity/pressure", "mechanical closure stop", "gate contact"]
              hidden_risk: "Trigger repeatability may depend on stroke velocity."

            stroke_length_targets:
              initial_range: "25–100 mm"
              reason: "Short enough for bench repeatability, long enough to observe timing separation."
              unresolved: "Minimum stroke needed for reliable buoyancy-state separation."

          subsystem_registry:
            chamber:
              operational_purpose: "Provide variable buoyancy state."
              likely_failure_modes: ["leakage", "trapped air drift", "insufficient displacement"]
              tolerance_sensitivity: "volume and seal geometry"
              maintenance_burden: "seal inspection"

            valve:
              operational_purpose: "Create passive state transition."
              likely_failure_modes: ["flutter", "late closure", "incomplete seating", "rebound reopening"]
              tolerance_sensitivity: "seat flatness, hinge friction, flap mass"
              maintenance_burden: "cleaning and wear observation"

            guide:
              operational_purpose: "Constrain vertical motion."
              likely_failure_modes: ["binding", "side-load friction", "alignment drift"]
              tolerance_sensitivity: "rail parallelism"
              maintenance_burden: "lubrication/alignment checks"

            pump:
              operational_purpose: "Restore buoyancy by evacuating water."
              likely_failure_modes: ["low flow", "backflow", "pressure pulsing", "vibration"]
              tolerance_sensitivity: "head height, tubing diameter, check valves"
              maintenance_burden: "filtering and flow checks"

            trigger:
              operational_purpose: "Define state-change timing."
              likely_failure_modes: ["early trigger", "missed trigger", "impact bounce"]
              tolerance_sensitivity: "stroke endpoint repeatability"
              maintenance_burden: "stop/cam wear inspection"

            output_linkage:
              operational_purpose: "Later observe mechanical capture."
              likely_failure_modes: ["dead-zone stall", "excess damping", "side-load injection"]
              tolerance_sensitivity: "crank angle and pivot alignment"
              maintenance_burden: "pivot wear checks"

          instrumentation_plan:
            Q_leak:
              method: "Seal chamber at restoration state; measure water gain or buoyancy loss over time."
              tools: ["graduated cylinder", "scale", "timed video"]
              priority: "highest"

            Q_pump:
              method: "Pump from chamber-equivalent depth into measured container over fixed time."
              tools: ["graduated container", "stopwatch", "same tubing/check valves as prototype"]
              priority: "highest"

            restoration_time:
              method: "Time from bottom valve closure to first upward motion."
              tools: ["video", "frame marks", "manual timestamp"]
              priority: "high"

            ingress_collapse_time:
              method: "Time from valve opening to downward motion onset."
              tools: ["video", "stroke ruler", "visible dye optional"]
              priority: "high"

            stroke_timing_variance:
              method: "Measure top-to-bottom, bottom-to-top, and full-cycle periods across repeated cycles."
              tools: ["video", "frame counter", "position marks"]
              priority: "high"

            valve_transition_timing:
              method: "Video valve open/close frame relative to chamber position."
              tools: ["transparent chamber", "high-frame-rate phone video"]
              priority: "high"

            rebound_behavior:
              method: "Observe bottom and top overshoot/bounce after impact."
              tools: ["position scale", "video"]
              priority: "high"

            oscillation_decay:
              method: "Disable pump or valve action selectively and observe amplitude loss."
              tools: ["position scale", "cycle count"]
              priority: "medium-high"

            friction_load:
              method: "Pull chamber through guide using hanging weights or spring scale."
              tools: ["spring scale", "known weights"]
              priority: "medium"

            side_loading:
              method: "Compare guide friction with linkage disconnected vs lightly connected."
              tools: ["spring scale", "video wobble observation"]
              priority: "medium"

            pressure_variation:
              method: "Use shallow depth ruler first; optional low-pressure sensor later."
              tools: ["water depth scale", "optional manometer tube"]
              priority: "medium"

          minimal_viable_cycle:
            successful_rise:
              required_conditions:
                - "net buoyancy exceeds weight, friction, and guide drag"
                - "valve remains sufficiently closed"
                - "linkage or tubing does not bind motion"

            successful_transition:
              required_conditions:
                - "top trigger opens ingress path repeatably"
                - "opening occurs at consistent position"
                - "transition does not produce uncontrolled rebound"

            successful_descent:
              required_conditions:
                - "water ingress collapses buoyancy fast enough"
                - "gravity exceeds remaining buoyancy and friction"
                - "valve does not flutter into partial closure"

            successful_restoration:
              required_conditions:
                - "bottom closure creates sufficient state separation"
                - "Q_pump > Q_leak"
                - "restoration time does not grow cycle-to-cycle"

            repeatable_next_cycle:
              required_conditions:
                - "stroke timing variance remains bounded"
                - "leakage does not accumulate"
                - "valve timing does not drift"
                - "friction does not increase during operation"

          state_machine_seed:
            states:
              top_ready:
                entry_conditions: ["chamber buoyant", "valve closed/seated", "near upper endpoint"]
                exit_conditions: ["top trigger opens ingress"]
                trigger_variables: ["position_top", "trigger_contact"]
                blocking_variables: ["valve stuck closed", "insufficient trigger force"]

              ingress_open:
                entry_conditions: ["valve open", "water entering chamber"]
                exit_conditions: ["buoyancy collapses enough for descent"]
                trigger_variables: ["valve_angle", "water_level_change"]
                blocking_variables: ["air lock", "low ingress rate", "flutter"]

              descending:
                entry_conditions: ["net downward force positive"]
                exit_conditions: ["bottom endpoint reached"]
                trigger_variables: ["position", "velocity"]
                blocking_variables: ["guide friction", "linkage resistance", "partial buoyancy"]

              bottom_transition:
                entry_conditions: ["lower endpoint reached"]
                exit_conditions: ["valve seated and restoration path active"]
                trigger_variables: ["bottom_contact", "valve_closed"]
                blocking_variables: ["rebound", "incomplete seating", "shock reopening"]

              restoring:
                entry_conditions: ["pump active", "valve sufficiently closed"]
                exit_conditions: ["positive buoyancy restored"]
                trigger_variables: ["pump_flow", "leak_rate", "chamber_water_volume"]
                blocking_variables: ["Q_leak >= Q_pump", "pump backflow", "pressure pulsing"]

              rising:
                entry_conditions: ["net upward force positive"]
                exit_conditions: ["top endpoint reached"]
                trigger_variables: ["buoyancy_margin", "position"]
                blocking_variables: ["static friction", "side-load", "premature ingress"]

              failure_states:
                flooded_stall: "Chamber cannot restore buoyancy."
                dry_stall: "Valve fails to open or ingress is insufficient."
                timing_drift: "Cycle continues but period/transition points migrate."
                flutter_loop: "Valve oscillates without clean state separation."
                guide_bind: "Mechanical friction prevents stroke completion."
                rebound_unlock: "Impact reopens valve or breaks restoration state."

          failure_discovery_strategy:
            likely_first_failure_points:
              - "valve seating repeatability"
              - "pump flow under real tubing/head"
              - "bottom rebound reopening"
              - "guide friction"
              - "air trapping"
              - "leakage through passive flap edges"

            hidden_coupling_risks:
              - "pump vibration affects valve seating"
              - "linkage side-load increases guide friction"
              - "valve flutter delays descent and consumes timing margin"
              - "bottom impact changes valve state"
              - "tube stiffness adds restoring or damping force"

            geometry_sensitive_regions:
              - "top trigger location"
              - "bottom closure location"
              - "valve seat angle"
              - "flap mass and hinge friction"
              - "stroke length"
              - "guide rail spacing"
              - "chamber displacement volume"

            passive_timing_instabilities:
              - "velocity-dependent triggering"
              - "flap bounce"
              - "late closure"
              - "partial-open states"
              - "hysteresis between opening and closing"

            restoration_collapse_pathways:
              - "leakage exceeds pump"
              - "pump starts before closure"
              - "backflow through pump"
              - "air pocket blocks evacuation"
              - "pressure pulse unseats valve"

          contradiction_register:
            restoration_vs_output_extraction:
              contradiction: "Any output load may reduce stroke reliability before state cycling is proven."
              preserve_as_unknown: "Maximum tolerable output load remains undefined."

            simplicity_vs_controllability:
              contradiction: "Passive mechanisms reduce complexity but remove precise timing control."
              preserve_as_unknown: "Whether passive timing self-bounds or drifts."

            passive_timing_vs_repeatability:
              contradiction: "Flaps and gravity closures are simple but sensitive to velocity, hinge friction, and turbulence."
              preserve_as_unknown: "Cycle-to-cycle valve timing variance."

            bounded_leakage_vs_practical_sealing:
              contradiction: "Perfect sealing is rejected, but insufficient sealing destroys restoration dominance."
              preserve_as_unknown: "Actual acceptable leakage threshold."

            short_stroke_vs_usable_displacement:
              contradiction: "Short stroke improves compact cycling but reduces available buoyancy-state margin."
              preserve_as_unknown: "Minimum displacement needed for reliable state separation."

            shallow_operation_vs_measurement_noise:
              contradiction: "Shallow pressure reduces restoration burden but may make small friction and timing errors dominant."
              preserve_as_unknown: "Relative size of friction losses vs buoyancy margin."

          test_queue_v1:
            - priority: 1
              test: "Static leak-rate test"
              question: "What is Q_leak in the closed/restoration state?"
              pass_fail_notation: "Do not pass/fail yet; classify leak as bounded, growing, or uncontrolled."

            - priority: 2
              test: "Pump flow under actual tubing/head"
              question: "What is Q_pump in the real restoration path?"
              compare_against: "Q_leak"

            - priority: 3
              test: "Valve repeatability dry/wet cycling"
              question: "Does the valve open and close at consistent positions?"

            - priority: 4
              test: "Bottom rebound observation"
              question: "Does impact reopen or disturb the restoration state?"

            - priority: 5
              test: "Ingress collapse timing"
              question: "How long from valve opening to committed descent?"

            - priority: 6
              test: "Restoration timing"
              question: "How long from bottom closure to upward motion?"

            - priority: 7
              test: "Guide friction and side-load test"
              question: "Does mechanical constraint consume buoyancy margin?"

            - priority: 8
              test: "Free oscillation damping"
              question: "How quickly does motion decay without active restoration?"

            - priority: 9
              test: "Ten-cycle repeatability run"
              question: "Do timing, stroke, valve state, and restoration delay remain bounded?"

            - priority: 10
              test: "Geometry perturbation test"
              question: "Which dimensions strongly affect cycle stability?"

          blocking_unknowns:
            - "Actual valve leakage at shallow depth"
            - "Pump flow after check valves and tubing losses"
            - "Minimum chamber displacement required"
            - "Valve flutter threshold"
            - "Air trapping behavior"
            - "Guide friction under wet conditions"
            - "Bottom impact energy"
            - "Whether rebound disrupts closure"
            - "Cycle timing variance over repeated runs"
            - "Whether restoration delay accumulates"
            - "Whether passive timing self-corrects or drifts"

          next_best_measurements:
            - "Q_leak closed-state measurement"
            - "Q_pump real-path measurement"
            - "Valve open/close video timing"
            - "Bottom rebound video"
            - "Rise/descent timing across repeated cycles"
            - "Guide friction with and without linkage"
            - "Restoration delay from bottom closure to upward motion"
    Recovery:
      source_file: Recovery
      source_path: /mnt/data/Recovery
      source_sha256: fce590e547871d5cf193d09a224fe4d17cbefb2adcbaf6b5df41655439a0cafe
      source_bytes: 18449
      recovery_rule: raw_source_snapshot_embedded_below_is_authority_recovery_for_this_lane
      raw_source_snapshot: |-
        Recovery:
          recovery:
            role: governed_reduction_and_reconstruction_protocol

            authority_state: "[GOVERNED RECOVERY-FORM PROTOCOL — NON-CANONICAL CAUSAL WRAPPER]"

            non_authority_clauses:
              - Recovery does not define causal primitives.
              - Recovery does not rewrite CE-OS.
              - Recovery does not replace CE-OS.
              - Recovery does not become canonical causal doctrine.
              - Recovery does not redefine Lexicon terms.
              - Recovery does not govern claim admissibility beyond reduction safety routing.
              - Recovery does not validate engineering, physics, prototype, or operational claims.
              - Recovery does not convert summaries into canon.
              - Recovery does not resolve contradictions by compression.
              - Recovery does not promote Prototype content into validated repository authority.

            governed_scope:
              purpose: >
                Recovery governs how compressed operational forms may be created,
                reviewed, rejected, routed, and reconstructed without damaging
                CE-OS causal kernel integrity, semantic exclusions, authority
                separation, contradiction lineage, or claim safety boundaries.

              governs:
                - admissible_reduction_behavior
                - reconstruction_requirements
                - compression_risk_visibility
                - exclusion_preservation
                - authority_lane_preservation
                - contradiction_lineage_preservation
                - handoff_rules_for_reduced_forms
                - rejection_conditions_for_unsafe_compression

              does_not_govern:
                - causal_truth
                - semantic_identity
                - claim_validation
                - topology_authority
                - prototype_validation
                - physics_confirmation
                - engineering_readiness
                - canonical_replacement

            protected_sources:
              CE_OS:
                authority_state: "[CANONICAL CAUSAL KERNEL]"
                protected_authority: causal_primitives_and_interaction_doctrine
                recovery_rule: >
                  CE-OS may be compressed only into subordinate recovery or
                  operational forms that preserve reconstruction paths back to
                  CE-OS source authority.

              Lexicon:
                authority_state: "[CANONICAL SEMANTIC REGISTRY]"
                protected_authority: semantic_identity_and_definition_control
                recovery_rule: >
                  Recovery forms must preserve Lexicon-controlled term identity
                  and must not create alternate definitions through paraphrase.

              Governance:
                authority_state: "[CANONICAL GOVERNANCE AUTHORITY]"
                protected_authority: claim_admissibility_and_firewall_control
                recovery_rule: >
                  Recovery forms must preserve claim safety boundaries and route
                  validation questions back to Governance.

              Directory:
                authority_state: "[ROUTING ONLY]"
                protected_authority: topology_and_navigation
                recovery_rule: >
                  Recovery forms may reference Directory routing but must not treat
                  routing visibility as canonical authority.

              Gold:
                authority_state: "[RECOVERY AND CONTRADICTION LINEAGE LAYER]"
                protected_authority: durable_recovery_paths_and_contradiction_lineage
                recovery_rule: >
                  Recovery forms must preserve contradiction lineage and recovery
                  pathways compatible with Gold.

              Prototype:
                authority_state: "[NON-CANONICAL DESIGN CONTROL FILE — PENDING VALIDATION]"
                protected_authority: candidate_design_and_mockup_control_only
                recovery_rule: >
                  Recovery forms must not promote Prototype material into canonical,
                  validated, or causally proven status.

            admissible_forms:
              - recovery_form:
                  status: admissible
                  condition: subordinate_to_source_authority
                  purpose: preserve reconstructable compressed access to source doctrine

              - operational_kernel_form:
                  status: admissible
                  condition: preserves_kernel_exclusions_and_reconstruction_path
                  purpose: reduce active routing weight without replacing CE-OS

              - onboarding_form:
                  status: admissible
                  condition: explicitly_non_canonical
                  purpose: introduce concepts without altering doctrine

              - navigation_form:
                  status: admissible
                  condition: routing_only
                  purpose: point users or models toward governing source locations

              - contradiction_recovery_form:
                  status: admissible
                  condition: contradiction_lineage_preserved
                  purpose: expose unresolved tensions without resolving them by summary

              - runtime_reference_form:
                  status: admissible
                  condition: short_term_operational_visibility_only
                  purpose: support active work without canon mutation

            prohibited_forms:
              - compressed_CE_OS_replacement
              - canonical_summary
              - doctrine_smoothing_form
              - merged_CE_OS_Lexicon_definition_form
              - merged_CE_OS_Governance_validation_form
              - Directory_as_authority_form
              - Prototype_promotion_form
              - contradiction_resolution_by_summary
              - unresolved_variable_erasure
              - exclusion_removed_for_readability
              - scalar_only_causal_summary
              - operational_validity_as_validation_form
              - field_mass_cross_domain_collapse
              - propagation_transfer_conflation
              - organization_source_conflation
              - amplification_energy_creation_conflation

            required_fields:
              - source_section
              - retained_kernel
              - retained_exclusions
              - omitted_material
              - authority_lane
              - contradiction_effect
              - reconstruction_pointer
              - compression_risk_level
              - governance_review_required

            preservation_invariants:
              causal_kernel:
                - interaction_as_measurable_state_affecting_relation
                - causal_accounting_before_scalar_reduction
                - operational_validity_not_causal_completeness
                - scalar_compression_warning
                - domain_separation
                - coupling_structure
                - propagation_vs_transfer
                - organization_logic

              semantic_exclusions:
                - propagation_not_transfer
                - organization_not_hidden_source
                - amplification_not_energy_creation
                - interpretation_not_validation
                - speculation_not_canon
                - operational_validity_not_causal_completeness
                - scalar_equivalence_not_functional_equivalence
                - summary_not_source_authority

              authority_separation:
                - CE_OS_defines_causal_primitives
                - Lexicon_defines_semantic_identity
                - Governance_defines_claim_admissibility
                - Directory_routes_topology_only
                - Gold_preserves_recovery_and_contradiction_lineage
                - Prototype_remains_non_canonical_pending_validation
                - Recovery_governs_reduction_and_reconstruction_only

              claim_safety:
                - no_validation_by_compression
                - no_proof_by_summary
                - no_claim_escalation
                - no_operational_readiness_inference
                - no_physics_confirmation
                - no_engineering_certification
                - no_causal_completeness_claim

              contradiction_visibility:
                - unresolved_variables_remain_visible
                - blocked_claims_remain_blocked
                - contradiction_sources_remain_recoverable
                - contradiction_effects_remain_routed
                - compression_does_not_resolve_disputes

            compression_tests:
              recursive_summarization_test:
                purpose: >
                  Detect whether repeated compression broadens, smooths, or mutates
                  the original doctrine.
                pass_condition: >
                  Repeated summaries preserve kernel, exclusions, authority lanes,
                  and prohibited interpretations.

              semantic_drift_test:
                purpose: >
                  Detect whether compressed language changes term identity or
                  admissible meaning.
                pass_condition: >
                  Compressed terms remain consistent with Lexicon-controlled identity.

              reconstruction_test:
                purpose: >
                  Verify that the governing source structure can be recovered from
                  the compressed form.
                pass_condition: >
                  Source section, retained kernel, exclusions, and authority route
                  are reconstructable.

              contradiction_recovery_test:
                purpose: >
                  Verify that contradictions and unresolved variables remain visible.
                pass_condition: >
                  Compression preserves contradiction source, affected variables,
                  blocked claims, and recovery route.

              authority_boundary_test:
                purpose: >
                  Detect hidden authority migration.
                pass_condition: >
                  CE-OS, Lexicon, Governance, Directory, Gold, Prototype, and Recovery
                  retain separate authority lanes.

              scalar_collapse_test:
                purpose: >
                  Detect replacement of causal accounting with scalar equivalence.
                pass_condition: >
                  Compressed form preserves causal organization, not merely outcome,
                  magnitude, or simplified metric.

              domain_separation_test:
                purpose: >
                  Detect collapse of mass-centric, field-centric, and cross-domain
                  interactions into generic causality.
                pass_condition: >
                  Relevant domain distinctions remain explicit or recoverable.

              exclusion_integrity_test:
                purpose: >
                  Verify that negative definitions remain present.
                pass_condition: >
                  The compressed form preserves what the doctrine must not collapse into.

              cross_agent_consistency_test:
                purpose: >
                  Verify that separate repository roles reconstruct compatible meaning.
                pass_condition: >
                  Gear, Grant, Cali, or other roles can recover the same authority
                  boundaries and kernel structure without hidden reinterpretation.

            contradiction_preservation:
              required_visibility:
                - contradiction_source
                - affected_source_section
                - affected_terms
                - affected_variables
                - affected_domain
                - blocked_claims
                - unresolved_status
                - measurement_or_review_dependency
                - recovery_pointer
                - governance_review_status

              prohibited_behavior:
                - resolving_contradiction_by_summary
                - hiding_unresolved_variables
                - flattening_blocked_claims
                - treating_ambiguity_as_resolution
                - converting_absence_of_conflict_into_validation
                - deleting_contradiction_history
                - merging_opposing_interpretations_without_review

              preservation_rule: >
                Compression may reduce repetition around contradictions, but it must
                not reduce contradiction recoverability. Any contradiction visible in
                source authority must remain discoverable through the compressed form.

            reconstruction_requirements:
              minimum_recovery_path:
                - compressed_form_to_source_section
                - source_section_to_authority_file
                - retained_kernel_to_original_kernel
                - retained_exclusions_to_original_negative_boundaries
                - omitted_material_to_non_deleted_source_context
                - contradiction_effect_to_lineage_or_review_route
                - claim_boundary_to_Governance
                - semantic_identity_to_Lexicon
                - causal_primitive_to_CE_OS
                - routing_reference_to_Directory
                - recovery_lineage_to_Gold

              reconstruction_must_preserve:
                - original_authority_source
                - source_subordination
                - kernel_structure
                - distinction_topology
                - negative_boundaries
                - domain_boundaries
                - claim_limits
                - contradiction_lineage
                - unresolved_variable_visibility
                - omission_disclosure

              reconstruction_failure_rule: >
                If a compressed form cannot recover the governing source authority,
                kernel, exclusions, authority lane, and contradiction impact, the
                compression is rejected.

            escalation_conditions:
              require_grant_review:
                - compression_changes_root_primitive
                - compression_changes_operational_validity_boundary
                - compression_changes_scalar_compression_warning
                - compression_changes_propagation_transfer_boundary
                - compression_changes_mass_field_cross_domain_boundary
                - compression_changes_organization_source_boundary
                - compression_changes_amplification_energy_boundary
                - compression_removes_negative_definition
                - compression_introduces_new_definition
                - compression_duplicates_Lexicon_authority
                - compression_duplicates_Governance_authority
                - compression_promotes_Directory_to_authority
                - compression_promotes_Prototype_claim
                - compression_hides_unresolved_variable
                - compression_erases_contradiction_lineage
                - compression_may_be_mistaken_for_canonical_replacement

              require_source_authority_review:
                CE_OS_review:
                  - causal_primitive_affected
                  - domain_boundary_affected
                  - interaction_doctrine_affected

                Lexicon_review:
                  - term_identity_affected
                  - definition_boundary_affected
                  - semantic_drift_detected

                Governance_review:
                  - claim_admissibility_affected
                  - validation_boundary_affected
                  - prohibited_claim_boundary_affected

                Gold_review:
                  - recovery_path_affected
                  - contradiction_lineage_affected
                  - reconstructability_affected

                Directory_review:
                  - routing_pointer_affected
                  - topology_reference_affected

            rejection_conditions:
              reject_if:
                - compressed_form_replaces_CE_OS
                - compressed_form_claims_canonical_causal_authority
                - compressed_form_changes_admissible_meaning
                - compressed_form_removes_required_exclusions
                - compressed_form_collapses_distinction_topology
                - compressed_form_collapses_domain_separation
                - compressed_form_conflates_propagation_and_transfer
                - compressed_form_conflates_organization_and_source
                - compressed_form_conflates_amplification_and_energy_creation
                - compressed_form_treats_interpretation_as_validation
                - compressed_form_treats_operational_validity_as_causal_completeness
                - compressed_form_erases_unresolved_variables
                - compressed_form_resolves_contradictions_without_review
                - compressed_form_hides_authority_migration
                - compressed_form_lacks_reconstruction_pointer
                - compressed_form_lacks_omitted_material_disclosure
                - compressed_form_fails_reconstruction_test
                - compressed_form_fails_authority_boundary_test
                - compressed_form_fails_exclusion_integrity_test

            handoff_rules:
              to_CE_OS:
                when:
                  - causal_kernel_unclear
                  - interaction_primitive_affected
                  - domain_boundary_affected
                handoff_purpose: causal_doctrine_reference

              to_Lexicon:
                when:
                  - term_identity_unclear
                  - definition_drift_detected
                  - paraphrase_changes_meaning
                handoff_purpose: semantic_identity_control

              to_Governance:
                when:
                  - claim_boundary_unclear
                  - validation_status_implicated
                  - prohibited_claim_possible
                  - authority_migration_possible
                handoff_purpose: admissibility_and_claim_firewall_review

              to_Directory:
                when:
                  - routing_path_unclear
                  - topology_pointer_needed
                  - file_location_or_model_lane_reference_needed
                handoff_purpose: navigation_only

              to_Gold:
                when:
                  - contradiction_lineage_needed
                  - recovery_path_needed
                  - reconstructability_risk_detected
                handoff_purpose: recovery_and_lineage_preservation

              to_Prototype:
                when:
                  - compressed_material_references_candidate_design
                  - mockup_or_layout_status_unclear
                  - validation_boundary_required
                handoff_purpose: non_canonical_candidate_status_reference

              general_rule: >
                Handoff transfers review responsibility to the appropriate authority
                lane. Handoff does not transfer authority ownership into Recovery.

            minimum_template:
              source_section:
                required: true
                description: >
                  Identifies the exact CE-OS section, clause, or source passage being
                  reduced. Must point back to source authority.

              retained_kernel:
                required: true
                description: >
                  Lists the causal primitives, distinctions, or interaction doctrines
                  preserved in the compressed form.

              retained_exclusions:
                required: true
                description: >
                  Lists the negative boundaries preserved by the compression: what the
                  compressed form must not be read as, merged with, or collapsed into.

              omitted_material:
                required: true
                description: >
                  Identifies explanation, pedagogy, examples, repetition, or non-kernel
                  material omitted from the compressed form. Omission is not deletion.

              authority_lane:
                required: true
                description: >
                  Declares which file retains authority over the compressed material
                  and confirms that Recovery does not become source authority.

              contradiction_effect:
                required: true
                description: >
                  States whether the compression touches known contradictions,
                  unresolved variables, blocked claims, or review dependencies.

              reconstruction_pointer:
                required: true
                description: >
                  Provides the path by which the original kernel, exclusions,
                  authority source, and contradiction lineage can be recovered.

              compression_risk_level:
                required: true
                allowed_values:
                  - low
                  - medium
                  - high
                  - prohibited
                description: >
                  Declares risk of semantic drift, causal loss, authority leakage,
                  contradiction erasure, or reconstruction failure.

              governance_review_required:
                required: true
                allowed_values:
                  - true
                  - false
                description: >
                  Indicates whether Grant/Governance review is required before the
                  compressed form may be used operationally.

            final_boundary:
              rule: >
                Recovery authorizes governed reductions only.
                Recovery does not authorize canonical replacement.
    Integration:
      source_file: Integration
      source_path: /mnt/data/Integration
      source_sha256: 799bdf3d31dffb02f83c2c553f88f014060b87afbf8722047cd97aed740a13ed
      source_bytes: 5685
      recovery_rule: raw_source_snapshot_embedded_below_is_authority_recovery_for_this_lane
      raw_source_snapshot: |-
        Integration:
          authority_state: NON_CANONICAL_SUPPORT_FILE
          classification: INTERFACE_CONSTRAINT_REGISTRY
          model: membrane_visibility_system

          purpose:
            note: >
              Integration records and constrains cross-file boundary contact.
              It exposes dependencies, handoffs, coupling points, reference survival
              obligations, and authority implications without deciding outcomes,
              resolving pressure, ranking authorities, validating claims, defining
              terms, or coordinating repository state.

          core_function:
            expose_contact_without_control

          preserved_property:
            separability_without_isolation

          governs:
            - interface_visibility
            - cross_file_contact_declarations
            - dependency_exposure
            - handoff_visibility
            - coupling_risk_flags
            - reference_survival_requirements
            - boundary_contact_records

          does_not_govern:
            - truth
            - validation
            - admissibility
            - semantic_identity
            - causal_primitives
            - canon
            - topology
            - authority_priority
            - conflict_resolution
            - transition_acceptance
            - reconstruction_validity

          source_authority_references:
            claim_admissibility: Governance
            causal_primitives: CE-OS
            semantic_identity: Lexicon
            durable_continuity: Gold
            reconstruction_mechanics: Recovery
            state_movement_constraints: Transition
            topology_visibility: Directory
            engineering_structure:
              - Engine
              - Physics
              - Prototype

          doctrine:
            interface_pressure:
              may:
                - expose_pressure
                - preserve_references
                - show_coupling
                - reveal_authority_implications
                - constrain_boundary_behavior

              may_not:
                - resolve_pressure
                - interpret_contacts
                - recommend_paths
                - prioritize_authorities
                - clean_conflicts
                - collapse_visibility

              reason: >
                Pressure resolution requires authority.
                Integration has no authority.

          interface_contact_record_schema:
            contact_id:
            files_touching:
              - source_file:
                contacted_file:

            contact_description:

            contact_kind:
              allowed_values:
                - reference
                - dependency
                - handoff
                - constraint
                - contradiction_exposure
                - transition_contact
                - recovery_contact
                - semantic_contact
                - causal_contact
                - engineering_contact
                - topology_contact

            implicated_authorities:
              - Governance
              - CE-OS
              - Lexicon
              - Gold
              - Recovery
              - Transition
              - Directory
              - Engine
              - Physics
              - Prototype

            boundary_rule:
              note: >
                State what this contact is allowed to expose or constrain.
                Do not state which file wins.

            prohibited_interpretations:
              - this_contact_does_not_validate
              - this_contact_does_not_resolve_conflict
              - this_contact_does_not_transfer_authority
              - this_contact_does_not_redefine_terms
              - this_contact_does_not_prioritize_sources
              - this_contact_does_not_clean_lineage

            references_that_must_survive:
              - source_file_paths
              - contradiction_ids
              - unresolved_variables
              - authority_notes
              - transition_records
              - recovery_records
              - failed_state_notes

            coupling_risk:
              level: low | medium | high
              risk_reason:

            required_followup:
              governance_check_if_claim_boundary_touched:
              lexicon_check_if_term_identity_touched:
              ce_os_check_if_causal_primitive_touched:
              transition_check_if_state_movement_touched:
              recovery_check_if_reconstruction_path_touched:
              directory_check_if_topology_visibility_touched:

          contradiction_reference_survival_rule:
            rule: >
              Integration must preserve contradiction lineage by reference, not summary.
              Boundary contact may expose contradiction pressure but may not resolve,
              soften, merge, rename, or clean the contradiction.

            required_preservation:
              - contradiction_id
              - source_location
              - affected_files
              - unresolved_variables
              - authority_lane_implicated
              - last_known_state
              - failed_or_blocked_transition_if_present

          prohibited_behavior_registry:
            - arbitration
            - priority_logic
            - conflict_resolution
            - automatic_conflict_handling
            - automatic_forward_interpretation
            - path_recommendation
            - authority_ranking
            - semantic_redefinition
            - validation_generation
            - canon_mutation
            - topology_ownership
            - handoff_cleanup
            - contradiction_summary_as_resolution
            - coordination_engine_behavior

          expansion_gate:
            current_state: frozen_after_minimal_draft

            expansion_prohibited_until:
              - measurable_boundary_density
              - repeated_interface_pressure
              - contradiction_lineage_load
              - retrieval_stress
              - transition_interface_coupling_pressure
              - Governance_collision_check

            prohibited_prebuild:
              - interface_taxonomies
              - contact_layers
              - routing_priorities
              - coordination_logic
              - arbitration_helpers
              - automatic_conflict_handling

          meta_governance_drift_watch:
            investigate_if_Integration_begins:
              - interpreting_contacts
              - recommending_paths
              - resolving_pressure
              - cleaning_conflicts
              - prioritizing_authorities
              - selecting_forward_interpretations
              - collapsing_visibility

            diagnosis_if_detected: >
              Integration is exceeding interface constraint role
              and drifting toward hidden meta-governance.

          terminal_lock:
            function: expose_contact_without_control
            repository_core: interaction_without_collapse
            preserved_property: separability_without_isolation
    Transition:
      source_file: Transition
      source_path: /mnt/data/Transition
      source_sha256: f472680dc61abc1a82fd569d6073c76b1ec5fdf6142fcb9254a03e6774d11334
      source_bytes: 14560
      recovery_rule: raw_source_snapshot_embedded_below_is_authority_recovery_for_this_lane
      raw_source_snapshot: |-
        Transition:
          role: state_change_governance_and_authority_leak_prevention_layer
          authority: constrained_transition_boundary_only

          caution:
            note: >
              Transition governs movement constraints,
              state-change visibility,
              rollback boundaries,
              admissibility propagation restrictions,
              and authority-leak prevention.

              Transition does not define:
                - truth
                - admissibility
                - semantic identity
                - causality
                - topology
                - canon
                - validation

              Transition constrains movement.
              It does not authorize destination authority.

          authority_boundaries:

            Governance:
              retains:
                - admissibility_authority
                - validation_authority
                - contradiction_resolution_authority
                - claim_boundary_authority
                - prohibited_claim_authority

            Lexicon:
              retains:
                - semantic_identity_authority
                - definition_authority
                - semantic_drift_control

            CE_OS:
              retains:
                - causal_discipline_authority
                - interaction_definition_authority
                - propagation_and_transfer_constraints

            Directory:
              retains:
                - topology_visibility_authority
                - routing_visibility_authority

            Recovery:
              retains:
                - survivability_support
                - reconstruction_support
                - rollback_access_support
                - lineage_support

            Gold:
              retains:
                - stability_preservation
                - recoverable_path_support
                - contradiction_lineage_support

          governing_principles:

            first_rule:
              statement: >
                State movement does not move authority.

            second_rule:
              statement: >
                Failed, contradictory, partial, contaminated,
                blocked, and unauthorized transitions must persist.

            third_rule:
              statement: >
                Recoverability does not imply reactivation.

            fourth_rule:
              statement: >
                Rollback restores visibility, not admissibility.

            fifth_rule:
              statement: >
                Transition cannot silently mutate semantic identity,
                admissibility, causality, or canonical status.

          minimally_admissible_scope:

            Transition_may_control:
              - transition_tracking
              - transition_constraints
              - state_change_visibility
              - rollback_boundary_management
              - transition_failure_persistence
              - migration_visibility
              - authority_propagation_blocking
              - reactivation_constraints
              - transition_labeling
              - partial_transition_visibility
              - temporal_boundary_enforcement

            Transition_must_not_control:
              - admissibility_definition
              - semantic_identity_definition
              - causal_truth_definition
              - canonical_validation
              - contradiction_resolution
              - evidence_sufficiency
              - topology_definition
              - source_authority_definition

          governed_transition_definition:

            governed_transition:
              meaning: >
                Any movement, attempted movement,
                restoration,
                rollback,
                migration,
                reactivation,
                quarantine,
                deprecation,
                relabeling,
                archival movement,
                or state mutation
                capable of affecting:
                  - authority perception
                  - admissibility
                  - semantic identity
                  - contradiction visibility
                  - causal interpretation
                  - topology routing
                  - repository continuity

          transition_states:

            persistent:
              meaning: >
                State remains preserved or traceable.
              authority_effect: none

            recovered:
              meaning: >
                State surfaced from survivability or reconstruction support.
              authority_effect: visibility_only

            archived:
              meaning: >
                Historical inactive state preserved for lineage.
              authority_effect: none

            deprecated:
              meaning: >
                Formerly active state no longer preferred or safe
                for default routing.
              authority_effect: inactive

            unresolved:
              meaning: >
                State contains unresolved contradiction,
                incomplete causal accounting,
                missing evidence,
                or unsettled semantic identity.
              authority_effect: limited_or_suspended

            quarantined:
              meaning: >
                State preserved but blocked from active routing due to risk.
              authority_effect: restricted_visibility

            candidate:
              meaning: >
                State proposed for possible active routing
                pending review.
              authority_effect: pending_only

            canonical:
              meaning: >
                State active within explicitly governed scope.
              authority_effect: explicitly_granted

            reactivated:
              meaning: >
                Previously inactive state restored to active routing
                after review.
              authority_effect: explicitly_granted_not_inherited

            rejected:
              meaning: >
                State denied active reuse after review.
              authority_effect: inactive_preserved_lineage

            failed_transition:
              meaning: >
                Transition attempt violated constraints,
                lacked required review,
                or produced unresolved mutation.
              authority_effect: none

            blocked_transition:
              meaning: >
                Transition prevented before completion.
              authority_effect: none

            partial_transition:
              meaning: >
                Transition known or inferred
                but incompletely visible.
              authority_effect: inspection_only

            contaminated_transition:
              meaning: >
                Transition mixed incompatible authority,
                semantic,
                contradiction,
                or causal states.
              authority_effect: quarantined

            contradictory_transition:
              meaning: >
                Transition conflicts with preserved lineage
                or competing transition records.
              authority_effect: unresolved

            unauthorized_transition:
              meaning: >
                Transition attempted authority movement
                without required review.
              authority_effect: void

            orphan_transition:
              meaning: >
                Transition lacks recoverable source or target identity.
              authority_effect: forensic_only

            temporal_authority_leak:
              meaning: >
                Prior authority attempts to propagate into current routing
                without current review.
              authority_effect: blocked

            transition_failed_semantic_drift:
              meaning: >
                Transition introduced unresolved semantic mutation.
              authority_effect: blocked_pending_Lexicon_review

          transition_metadata:

            required_fields:
              - transition_id
              - source_state
              - target_state
              - affected_object_identity
              - affected_authority_lanes
              - transition_reason
              - transition_scope
              - initiating_context
              - prior_admissibility_status
              - proposed_admissibility_status
              - semantic_identity_status
              - contradiction_status_before
              - contradiction_status_after
              - recovery_relationship_if_any
              - rollback_relationship_if_any
              - required_authority_review
              - review_status
              - visibility_status
              - reversibility_status
              - failure_mode_if_any
              - prohibited_claims_attached

          admissibility_propagation:

            default_rule:
              statement: >
                Admissibility does not automatically propagate through transition.

            governing_rule:
              statement: >
                Transition may preserve lineage and historical labels.
                It may not preserve active admissibility
                unless Governance explicitly reasserts it.

            hard_stop_conditions:
              - partially_visible_transition_requests_authority_effect
              - recovered_state_requests_active_use_without_review
              - deprecated_state_requests_reactivation_without_review
              - contradiction_lineage_missing
              - semantic_identity_unresolved
              - rollback_attempts_authority_restoration
              - hidden_recovery_path_requests_canonical_routing

          authority_transfer_constraints:

            default:
              authority_transfer: blocked

            authority_may_transfer_only_when:
              - source_authority_is_identified
              - target_authority_is_identified
              - governing_review_is_complete
              - semantic_identity_is_checked
              - contradiction_status_is_preserved
              - transition_metadata_is_complete
              - prohibited_claims_are_attached
              - active_authority_scope_is_explicit

            prohibited_authority_transfer:
              - rollback_without_review
              - recovery_without_review
              - partially_visible_transition
              - unresolved_semantic_identity
              - unresolved_contradiction
              - orphan_transition
              - contaminated_transition
              - unauthorized_transition

          rollback_governance:

            rollback_definition:
              meaning: >
                Rollback restores visibility,
                inspectability,
                comparison capability,
                and lineage access.

                Rollback does not restore:
                  - admissibility
                  - validation
                  - canonical authority
                  - semantic authority
                  - causal truth

            rollback_may:
              - expose_prior_state
              - support_reconstruction
              - support_forensics
              - reveal_contradiction_emergence
              - restore_visibility

            rollback_must_not:
              - erase_later_contradictions
              - silently_replace_active_state
              - reactivate_deprecated_state
              - imply_validation
              - bypass_Governance
              - bypass_Lexicon
              - delete_failed_transition_records

          reactivation_rules:

            default_rule:
              statement: >
                Reactivation is prohibited until reviewed.

            required_reviews:

              Governance:
                required_for:
                  - admissibility_restoration
                  - validation_status_change
                  - canonical_routing
                  - contradiction_resolution_claims

              Lexicon:
                required_for:
                  - semantic_identity_reuse
                  - deprecated_meaning_reuse
                  - semantic_conflict_resolution

              CE_OS:
                required_for:
                  - causal_claim_reactivation
                  - interaction_logic_reactivation
                  - engineering_mechanism_reentry

              Directory:
                required_for:
                  - active_topology_visibility_change
                  - routing_exposure_change

            prohibited_reactivation_conditions:
              - unresolved_semantic_conflict
              - unresolved_contradiction
              - hidden_source_identity
              - recoverability_used_as_authority
              - rollback_used_as_validation
              - missing_review_path

          contradiction_preservation:

            doctrine:
              statement: >
                Transition cannot resolve contradiction through movement.

            requirements:
              - contradiction_markers_follow_the_object
              - contradictory_versions_remain_distinguishable
              - failed_transitions_persist
              - rollback_preserves_later_conflicts
              - migration_cannot_summarize_conflict_into_resolution
              - contradictory_transitions_remain_visible

            prohibited_effects:
              - transition_erases_conflict
              - rollback_erases_contradiction
              - migration_hides_conflict
              - reactivation_ignores_conflict
              - compression_removes_recovery_path

          semantic_identity_protection:

            governing_rule:
              statement: >
                Transition cannot mutate semantic identity silently.

            required_controls:
              - semantic_identity_checked_before_transition
              - semantic_identity_checked_after_transition
              - deprecated_meanings_remain_deprecated_until_reviewed
              - restored_terms_cannot_override_current_terms
              - semantic_drift_requires_Lexicon_review
              - migrated_terms_preserve_lineage

          temporal_boundary_conditions:

            doctrine:
              statement: >
                Authority is context-bound and time-bound.

            rules:
              - prior_authority_does_not_automatically_survive_restoration
              - historical_canonical_status_requires_current_review
              - rollback_does_not_restore_current_authority
              - intervening_contradictions_must_persist
              - historical_semantics_require_current_Lexicon_alignment
              - historical_causal_claims_require_current_CE_OS_alignment

          partial_transition_visibility:

            governing_rule:
              statement: >
                Partial visibility supports inspection only,
                never authority propagation.

            required_label_conditions:
              - hidden_source_state
              - hidden_target_state
              - incomplete_transition_path
              - incomplete_contradiction_visibility
              - unresolved_semantic_identity
              - unresolved_authority_effect

            prohibited_effects:
              - partial_visibility_as_validation
              - partial_visibility_as_admissibility
              - partial_visibility_as_canonical_routing
              - hidden_transition_authority_transfer

          recoverability_vs_transition_authority:

            recoverability:
              meaning: >
                State may be surfaced,
                reconstructed,
                inspected,
                or compared.
              authority_effect: none

            transition_authority:
              meaning: >
                State movement permitted to affect active routing.
              authority_effect: requires_explicit_review

            governing_rule:
              statement: >
                Recoverability may expose a state.
                Transition may constrain movement.
                Neither grants admissibility.

          prohibited_transition_effects:

            - transition_implies_validation
            - transition_implies_admissibility
            - rollback_implies_truth
            - rollback_implies_current_authority
            - recoverability_implies_reactivation
            - recovery_implies_authority
            - migration_erases_contradiction
            - restored_semantics_override_current_semantics
            - partial_visibility_supports_authority
            - transition_resolves_contradiction
            - transition_defines_canon
            - transition_redefines_semantics
            - transition_redefines_causality
            - transition_redefines_topology
            - transition_becomes_shadow_governance

          installation_recommendation:

            name: Transition_Governance_Boundary_Protocol

            placement:
              - referenced_by_Governance
              - referenced_by_Recovery
              - referenced_by_Gold
              - constrained_by_Lexicon
              - constrained_by_CE_OS
              - topology_visible_through_Directory

            caution:
              note: >
                Transition should exist as a movement firewall,
                not as a positive authority engine.

                Its role is to prevent silent authority mutation
                during state movement.

          bottom_line:

            statement: >
              Transition is admissible only as a constrained state-change layer
              designed to preserve lineage,
              prevent authority leakage,
              preserve contradiction visibility,
              constrain rollback semantics,
              and prevent silent semantic or admissibility mutation
              during movement through repository state-space.
