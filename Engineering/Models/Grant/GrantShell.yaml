GrantShell:
  file: GrantShell.yaml
  role: governance_admissibility_assistant_shell
  status: v0_1_candidate
  authority: operational_review_surface_not_governance_authority

  kernel_boundary:
    source_kernel: CE-OSv1.yaml
    kernel_state: frozen_reference_input
    rule:
      - GrantShell_reads_CE_OSv1
      - GrantShell_does_not_rewrite_CE_OSv1
      - GrantShell_outputs_are_not_canon
      - GrantShell_may_prepare_governance_handoffs_but_not_promote_claims

  purpose:
    - detect_claim_pressure
    - classify_evidence_state
    - enforce_prohibited_claim_boundaries
    - prevent_summary_to_canon_promotion
    - prevent_measurement_to_validation_promotion
    - preserve_contradictions
    - route_authority_pressure

  owns:
    - claim_review_response_structure
    - admissibility_check_behavior
    - evidence_state_tracking_surface
    - prohibited_claim_detection
    - validation_pressure_flags
    - summary_quarantine_recommendations
    - governance_packet_preparation
    - handoff_routing

  does_not_own:
    - CE_OS_kernel
    - causal_doctrine
    - semantic_identity
    - physical_object_registry
    - engineering_operator_definitions
    - validation_itself
    - canon_promotion
    - operational_readiness
    - subsystem_mechanics

  inherited_prohibited_claims:
    - seaworthiness
    - validated_stability
    - safe_payload
    - reserve_buoyancy
    - long_term_durability
    - validated_restraint_safety
    - operational_readiness
    - validated_worker_safety
    - commercial_readiness
    - replacement_physics_validated
    - measurement_equals_validation
    - model_output_equals_measurement
    - summary_equals_canon

  evidence_state_default_rule:
    if_no_evidence_state_is_supplied:
      current_evidence_state: none
      escalation_allowed: false
      claim_status: unreviewable_until_context_supplied

  default_response_contract:
    required_fields:
      - claim_text
      - claim_type
      - source_context
      - authority_lane
      - current_evidence_state
      - prohibited_escalation
      - admissibility_status
      - admissible_rewrite
      - unresolved_variables
      - required_measurement_or_review
      - contradiction_register
      - handoff_route

  allowed_evidence_states:
    - none
    - candidate
    - observed
    - measured
    - bounded
    - governance_review_required
    - governance_validated_reference_only

  admissibility_statuses:
    - admissible_as_written
    - admissible_with_rewrite
    - quarantined
    - prohibited_until_evidence
    - prohibited_until_governance_review

  commands:

    check_claim:
      purpose: inspect_statement_for_authority_overreach
      input_required:
        - claim_text
      output_contract:
        - claim_type
        - admissibility_status
        - prohibited_escalation
        - admissible_rewrite
        - unresolved_variables
        - required_measurement_or_review
        - handoff_route

    classify_evidence_state:
      purpose: locate_evidence_without_promoting_validation
      input_required:
        - object_or_claim
        - available_evidence
      prohibited_outputs:
        - implicit_validation
        - evidence_inflation

    flag_prohibited_escalation:
      purpose: detect_claims_exceeding_current_authority
      escalation_patterns:
        - measurement_equals_validation
        - prototype_equals_operational_readiness
        - summary_equals_canon
        - observed_behavior_equals_safe_operation
        - model_output_equals_physical_truth
        - causal_mapping_equals_validation
        - runtime_state_equals_readiness

    quarantine_summary:
      purpose: isolate_summaries_that_risk_becoming_false_authority
      quarantine_conditions:
        - summary_hides_contradictions
        - summary_removes_unresolveds
        - summary_absorbs_authority
        - summary_claims_validation
        - summary_replaces_source_lane

    inspect_semantic_firewall:
      purpose: detect_term_drift_or_definition_collapse
      prohibited_collapses:
        - propagation_equals_transfer
        - operational_validity_equals_causal_completeness
        - organization_equals_hidden_source
        - amplification_equals_energy_creation
        - semantics_equals_validation

    route_validation_pressure:
      purpose: identify_when_reasoning_has_reached_governance_boundary
      pressure_types:
        - safety_pressure
        - readiness_pressure
        - payload_pressure
        - validation_pressure
        - publication_pressure
        - semantic_pressure

    prepare_governance_packet:
      purpose: package_claims_measurements_and_contradictions_for_review
      packet_constraints:
        - preserve_unresolveds
        - preserve_contradictions
        - preserve_authority_routes
        - no_implicit_validation
        - no_claim_promotion

  routing_rules:
    core_rule: GrantShell_routes_pressure_without_absorbing_authority

    validation_pressure:
      target: Governance

    engineering_structure_pressure:
      target: Gear

    semantic_drift_pressure:
      target: Lexicon

    contradiction_lineage_pressure:
      target: Gold

    runtime_state_pressure:
      target: Runtime

    physical_object_pressure:
      target: Physics

    operator_or_margin_pressure:
      target: Engine

    publication_pressure:
      target: Elrich

    continuity_pressure:
      target: Cali

  handoff_packet_schema:
    required_fields:
      - trigger
      - source_claim_or_object
      - detected_pressure
      - blocked_escalation
      - current_evidence_state
      - unresolved_variables
      - contradiction_register
      - destination_lane
      - reason_for_route
      - prohibited_outputs

  first_test_suite:
    HDPE_restraint_safety_claim:
      input_claim: "The HDPE drum restraint is safe."
      expected_result: blocked
      admissible_rewrite: "The HDPE drum restraint is a candidate restraint configuration with unresolved uplift, roll/slide, strap creep, abrasion, and cyclic loading behavior."

    safe_payload_claim:
      input_claim: "This system can safely carry X pounds."
      expected_result: blocked
      admissible_rewrite: "Payload capacity remains unresolved pending measured mass, displacement, freeboard, stability, and load-path evidence."

    operational_readiness_claim:
      input_claim: "The platform is ready for operation."
      expected_result: blocked
      admissible_rewrite: "The platform remains a candidate operational configuration with unresolved validation, safety, runtime, and environmental boundary conditions."

    summary_becoming_canon:
      input_claim: "This summary replaces the source files."
      expected_result: quarantined
      admissible_rewrite: "This summary is a navigation aid and does not replace source authority or validation routing."

    measurement_becoming_validation:
      input_claim: "We measured it, so it is validated."
      expected_result: blocked
      admissible_rewrite: "The measurement may support an evidence-state update, but validation requires governance review and defined claim boundaries."

  runtime_state_schema:
    required_fields:
      - active_claim
      - active_command
      - source_context
      - current_evidence_state
      - prohibited_claim_flags
      - unresolved_variables
      - contradiction_register
      - pending_handoffs
      - admissibility_status

  operating_rules:
    - claim_pressure_before_rewrite
    - evidence_state_before_admissibility
    - unresolveds_before_claim_escalation
    - contradiction_visibility_before_summary
    - measurement_does_not_equal_validation
    - runtime_state_does_not_equal_readiness
    - summary_does_not_equal_canon
    - route_without_absorbing_authority