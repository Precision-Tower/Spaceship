      - perception_treated_as_validation
      - visualization_treated_as_evidence
      - instrument_output_treated_as_neutral
      - filtered_signal_treated_as_raw_or_clean_physics
      - cross_observer_agreement_treated_as_validation
      - summary_compression_treated_as_canon
      - dashboard_clarity_treated_as_evidence_state_promotion

    admissible_rewrites:
      sensing_claim: Observer-conditioned signal recorded under declared topology, method, regime, and uncertainty.
      perception_claim: Interpretation produced from declared signal inputs and processing rules, not measurement or validation.
      visualization_claim: Rendering of selected records for review, not evidence authority.
      instrumentation_claim: Instrument output bounded by observer stack, calibration, bandwidth, filtering, synchronization, and backreaction limits.
      validation_claim: Sensing output may support review requests; validation requires governed review against declared scope.

    missing_boundaries:
