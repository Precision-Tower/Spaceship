        - ParticipationSurfaceDefinition
        - TransitionContract
        - MeasurementSchema
        - AssumptionTemplate
      caution: resources_are_shared_by_reference_unless_isolated

    Signal:
      role: low_coupling_notification_channel
      allowed:
