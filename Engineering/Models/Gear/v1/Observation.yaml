        - notify_inspection_panel
        - enqueue_external_events
      prohibited:
        - bypass_transition_arbitration
        - hidden_authority_transfer

    _process:
      role: visual_update_or_UI_domain
      prohibited:
        - core_transition_commit_authority

    _physics_process:
