          - cable_coupling
          - shielding_gap
          - probe_loading
          - bandwidth_limit
        blocked_claims:
          - field_detection_equals_propagation_claim
          - voltage_signal_equals_system_truth

      algorithmic_perception:
        common_outputs:
          - classification
          - segmentation
          - anomaly_flag
          - feature_vector
          - confidence_score
        risks:
          - training_distribution_mismatch
          - label_leakage
          - confidence_misread_as_probability_of_truth
          - hidden_preprocessing
          - false_consensus_with_visualization
        blocked_claims:
          - algorithm_classified_equals_measured
          - confidence_score_equals_evidence_state
          - anomaly_flag_equals_causal_diagnosis

  raw_vs_filtered_rules:
    - raw_signal_and_filtered_signal_are_distinct_records
    - filtered_signal_must_reference_source_raw_signal
    - filtered_signal_must_disclose_filter_type_cutoff_window_delay_and_processing_steps
    - filtered_signal_may_not_replace_raw_transition_history
    - filtered_smoothness_is_not_physical_smoothness
    - event_boundaries_shifted_by_filtering_must_be flagged
    - visualization_of_filtered_signal_must_not_be_labeled_as_raw_behavior

  calibration_and_synchronization_rules:
    calibration:
      required:
        - instrument_id
        - calibration_status
        - calibration_date_or_unknown
        - calibration_method_or_unknown
        - drift_estimate_or_unresolved
        - uncertainty_notes
        - saturation_or_range_limits
      blocked:
        - calibrated_by_assumption
        - precision_display_equals_accuracy
        - stable_readout_equals_calibrated

    synchronization:
      required:
        - clock_source
        - timestamp_method
        - channel_latency
        - sync_error_bound
        - trigger_threshold
        - alignment_method
        - drift_estimate
        - unresolved_ordering_risk
      blocked:
        - timestamp_order_equals_causal_order_without_sync_review
        - simultaneous_by_display_equals_synchronized
        - visual_alignment_equals_temporal_equivalence

  bridge_review_rules:
    - no_cross_stack_comparison_without_observer_world_identity
    - no_cross_modality_equivalence_without_bridge_review
    - no_averaging_across_observer_worlds_without_transformation_review
    - no_majority_observer_resolution
    - no_cleaner_signal_resolution
    - no_preferred_model_resolution
    - no_bridge_model_may_claim_neutrality
    - bridge_records_must_preserve_lost_variables
    - bridge_records_must_preserve_event_boundary_mapping
    - bridge_records_must_disclose_translation_cost_and_causal_information_erasure

  summary_compression_rules:
    allowed:
      - navigation_summary_with_source_links
      - status_summary_with_unresolveds_visible
      - anomaly_summary_with_observer_stack_identity
      - visualization_caption_with_evidence_boundary_footer

    blocked:
      - summary_replaces_signal_lineage
      - dashboard_replaces_raw_records
      - executive_summary_removes_observer_topology
      - conclusion_language_sounds_validated
      - detected_becomes_confirmed
      - interpreted_becomes_measured
      - visualized_becomes_evidence
      - averaged_becomes_resolved
      - agreement_becomes_validation

    required_footer:
      - summary_is_navigation_only
      - source_signal_records_remain_authority_for_lineage
      - observer_topology_remains_attached
      - no_validation_or_readiness_claim_implied
      - unresolveds_and_contradictions_remain_active

  admissibility_checks:
    sensing_vs_measurement:
      question: Does the record claim measurement status?
      allowed_if:
        - variable_identity_declared
        - method_declared
        - units_declared
        - context_declared
        - uncertainty_declared
        - calibration_status_declared
        - observer_stack_identity_declared
        - regime_identity_declared
        - routed_to_Evidence_for_state_review
      block_if:
        - signal_exists_only
        - no_units
        - no_uncertainty
        - no_method
        - no_observer_stack
        - no_calibration
        - no_context

    perception_vs_interpretation:
      question: Does perception language imply correctness or validation?
      allowed_if:
        - interpretation_method_declared
        - source_signal_lineage_declared
        - confidence_meaning_limited
        - false_positive_and_false_negative_risks_preserved
      block_if:
        - perception_output_treated_as_truth
        - classification_treated_as_measurement
        - inference_treated_as_observation

    visualization_vs_evidence:
      question: Does a display carry evidence authority?
      allowed_if:
        - visualization_source_records_declared
        - omitted_variables_disclosed
        - rendering_transform_disclosed
        - non_evidence_footer_present
      block_if:
        - visualization_replaces_records
        - chart_clarity_treated_as_evidence
        - heatmap_treated_as_measurement

    signal_vs_truth:
      question: Is a signal pattern treated as native physical truth?
      allowed_if:
        - signal_path_lineage_declared
        - observer_backreaction_candidates_preserved
        - alternative_artifact_candidates_preserved
      block_if:
        - signal_pattern_directly_named_as_causal_source
        - smoothness_treated_as_clean_physics
        - agreement_treated_as_validation

  contradiction_register:
    - sensing_improves_visibility_vs_sensing_does_not_create_truth
    - perception_speed_vs_reconstructable_signal_lineage
    - clean_visualization_vs_dirty_signal_history
    - cross_stack_agreement_vs_shared_artifact
    - filtered_stability_vs_native_instability
    - observer_presence_vs_native_behavior
    - summary_utility_vs_topology_loss
    - instrumentation_precision_vs_accuracy_uncertainty
    - algorithmic_confidence_vs_evidence_state
    - bridge_convenience_vs_causal_information_erasure

  unresolved_register:
    - final_acceptance_of_Senses_as_active_lane
    - exact_relationship_between_Senses_and_Evidence_record_storage
    - whether_Senses_holds_runtime_signal_records_or_only_schema
    - modality_specific_record_templates_pending_expansion
    - calibration_schema_alignment_pending
    - synchronization_schema_alignment_pending
    - bridge_review_schema_alignment_with_Interface_pending
    - raw_signal_storage_policy_pending
    - filtered_signal_storage_policy_pending
    - visualization_output_storage_policy_pending
    - perception_algorithm_documentation_policy_pending
    - observer_backreaction_control_protocol_pending
    - cross_observer_comparison_protocol_pending

  routing_rules:
    route_to_Evidence:
      when:
        - sensing_output_claims_measurement_status
        - evidence_state_labeling_needed
        - repeatability_language_appears
        - validation_language_appears
        - measurement_sufficiency_review_needed
      prohibited_outputs:
        - Senses_promotes_evidence_state
        - Senses_declares_validation

    route_to_Boundary:
      when:
        - sensing_language_exceeds_evidence_state
        - perception_or_visualization_implies_validation
        - instrumentation_claims_neutrality
        - operational_readiness_or_safety_language_appears
      prohibited_outputs:
        - sensing_claim_escapes_firewall
        - dashboard_becomes_authority

    route_to_Governance:
      when:
        - validation_pressure_persists_after_Boundary_flag
        - claim_promotion_requested
        - external_readiness_or_safety_language_required
      prohibited_outputs:
        - Senses_validates_claim
        - Senses_certifies_system

    route_to_Physics:
      when:
        - observer_object_identity_needed
        - sensing_surface_interaction_topology_needed
        - observer_backreaction_candidate_affects_system
        - physical_boundary_or_variable_attachment_unclear
      prohibited_outputs:
        - Senses_redefines_physical_object_registry
        - Senses_redefines_interaction_topology

    route_to_Interface:
      when:
        - cross_modality_translation_occurs
        - observer_worlds_are_compared
        - bridge_loss_or_erased_variable_review_needed
        - event_boundary_mapping_needed
      prohibited_outputs:
        - Senses_declares_cross_world_equivalence
        - Senses_averages_observer_worlds_without_review

    route_to_CE_OS:
      when:
        - causal_accounting_order_is_touched
        - transfer_vs_propagation_blurs
        - scalar_summary_hides_signal_path_or_losses
      prohibited_outputs:
        - Senses_redefines_causal_primitives

    route_to_Lexicon:
      when:
        - sense_detect_observe_measure_perceive_validate_terms_blur
        - terminology_expands_admissibility
      prohibited_outputs:
        - Senses_mutates_semantic_identity

    route_to_Runtime:
      when:
        - active_sensing_logs_are_created
        - event_state_records_are_created
        - anomaly_records_enter_active_operations
      prohibited_outputs:
        - runtime_log_equals_readiness
        - active_state_equals_validation

    route_to_Gold:
      when:
        - contradiction_lineage_must_survive_summary
        - recovery_path_needed
        - compression_risk_detected
      prohibited_outputs:
        - summary_resolves_contradiction
        - route_equals_truth

  standard_output_contract:
    required_fields:
      - sensing_claim_or_record
      - observer_stack_id
      - sensing_surface_id
      - signal_path_id
      - raw_signal_reference
      - filtered_signal_reference_if_any
      - perception_record_if_any
      - visualization_record_if_any
      - evidence_state_boundary
      - admissible_claims
      - blocked_claims
      - observer_backreaction_candidates
      - calibration_status
      - synchronization_quality
      - bridge_review_required
      - unresolveds
      - contradiction_links
      - required_routes
      - claim_boundary_footer

  claim_boundary_footer:
    - Senses_records_observer_conditioned_signal_and_perception_boundaries_only
    - Senses_does_not_validate_measure_or_certify_by_itself
    - visualization_does_not_increase_evidence_state
    - instrumentation_is_not_neutral_by_default
    - observer_world_comparison_requires_bridge_review
    - unresolveds_and_contradictions_remain_active
    - cute_sensors_do_not_get_a_crown

  Grant_review:
    target_file: Senses.yaml
    evidence_state:
      file_state: v1_candidate_created_from_admissibility_review
      review_state: admissibility_surface_pressure_test_only
      current_support_level: architecture_candidate
      blocked_promotions:
        - sensing_equals_truth
        - perception_equals_validation
        - visualization_equals_evidence
        - instrumentation_equals_neutral_observer
        - cross_observer_agreement_equals_validation
        - smooth_signal_equals_clean_physics
        - observer_stack_equals_canon

    prohibited_escalations:
      - sensing_treated_as_truth
      - perception_treated_as_validation
      - visualization_treated_as_evidence
      - instrument_output_treated_as_neutral
      - filtered_signal_treated_as_raw_or_clean_physics
      - cross_observer_agreement_treated_as_validation
      - summary_compression_treated_as_canon
      - dashboard_clarity_treated_as_evidence_state_promotion

    admissible_rewrites:
      sensing_claim: Observer-conditioned signal recorded under declared topology, method, regime, and uncertainty.
      perception_claim: Interpretation produced from declared signal inputs and processing rules, not measurement or validation.
      visualization_claim: Rendering of selected records for review, not evidence authority.
      instrumentation_claim: Instrument output bounded by observer stack, calibration, bandwidth, filtering, synchronization, and backreaction limits.
      validation_claim: Sensing output may support review requests; validation requires governed review against declared scope.

    missing_boundaries:
      - final_storage_boundary_between_Senses_and_Evidence
      - modality_specific_bridge_templates
      - calibration_record_format_alignment
      - synchronization_record_format_alignment
      - raw_signal_storage_policy
      - perception_algorithm_disclosure_depth
      - visualization_caption_footer_enforcement
      - observer_backreaction_control_thresholds

    observer_topology_risks:
      - sensor_neutrality_assumption
      - observer_world_collapse
      - modality_equivalence_laundering
      - filter_erases_event_boundary
      - dashboard_authority_bleed
      - backreaction_invisibility
      - calibration_silence
      - synchronization_blindness
      - interpretation_as_measurement

    contradiction_register:
      - sensing_improves_visibility_vs_sensing_does_not_create_truth
      - perception_speed_vs_reconstructable_lineage
      - clean_visualization_vs_dirty_signal_history
      - cross_stack_agreement_vs_shared_artifact
      - filtered_stability_vs_native_instability
      - observer_presence_vs_native_behavior
      - summary_utility_vs_topology_loss

    unresolveds_preserved:
      - final_acceptance_of_Senses_as_active_lane
      - exact_Evidence_boundary
      - exact_Physics_boundary_for_observer_objects
      - exact_Interface_bridge_review_contract
      - active_runtime_record_policy
      - modality_expansion_depth
      - calibration_and_sync_schema_alignment
      - backreaction_control_protocol

    required_routes:
      Evidence: evidence_state_labeling_and_measurement_sufficiency
      Boundary: claim_escalation_firewall
      Governance: persistent_validation_pressure
      Physics: observer_object_identity_and_interaction_topology
      Interface: cross_modality_and_cross_observer_bridge_review
      CE_OS: causal_accounting_and_transfer_vs_propagation_boundary
      Lexicon: semantic_drift_control
      Runtime: active_sensing_log_records
      Gold: contradiction_lineage_and_reconstructability

    verdict: >
      Senses.yaml is admissible only as an observer-conditioned sensing,
      signal-lineage, perception-boundary, and visualization-boundary surface.
      It does not validate, canonize, measure by itself, certify neutrality,
      or convert observer outputs into truth. Any language allowing sensing,
      perception, visualization, instrumentation, or cross-observer agreement
      to impersonate evidence authority is blocked and routed.
      Cute sensors do not get a crown.

VisionOps:
  file: VisionOps.yaml
  role: causal_simulation_and_cross_domain_runtime_doctrine
  status: phase_3_active_compression_candidate
  created_utc: "2026-05-23T08:38:25.633089+00:00"
  authority: Gear_operational_vision_layer_not_validation_authority

  reference_header:
    gear_kernel_bridge: ./GearKernelBridge.yaml
    simulation_bridge: ./SimulationBridge.yaml
    godot_ops: ./GodotOps.yaml
    simulate: ./Simulate.yaml

    local_scope:
      owns:
        - visual_interpretation_behavior
        - causal_visual_runtime_requests
        - visual_failure_surface_warnings
      does_not_own:
        - command_contract_authority
        - Godot_behavioral_reality
        - simulation_validation
        - canon_promotion

    rules:
      - command_semantics_route_to_SimulationBridge
      - Godot_behavior_routes_to_GodotOps
      - authority_boundaries_route_to_GearKernelBridge
      - simulation_construction_routes_to_Simulate
      - visual_outputs_are_not_evidence

  purpose:
    - compress_Grant_simulation_doctrine_into_Gear_native_runtime_doctrine
    - preserve_shortest_path_between_simulation_logic_and_Godot_runtime
    - define_minimum_causal_simulation_primitives_for_visual_runtime_operation
    - prevent_domain_collapse_scalar_collapse_and_validation_bleed
    - keep_Godot_as_runtime_host_not_causal_truth_authority

  core_rule: >
    Godot hosts the runtime. VisionOps owns causal simulation doctrine.
    Grant governs evidence and claim meaning. Gear operates the visual and causal
    extraction layer. No simulation output, visual behavior, or runtime state may
    self-promote into validation, safety, readiness, or physical truth.

  authority_split:
    Grant:
      owns:
        - evidence_state_discipline
        - claim_boundaries
        - simulation_integrity_rules
        - falsification_pressure
        - measurement_vs_validation_boundary
      blocked_from:
        - Godot_runtime_implementation_authority
        - Gear_runtime_topology_ownership
        - direct_engine_execution_authority

    Gear:
      owns:
        - causal_runtime_architecture
        - visual_causal_surface
        - object_interaction_mapping
        - operator_request_preparation
        - unresolved_measurement_extraction
        - Godot_adapter_design
      blocked_from:
        - validation_claims
        - evidence_promotion
        - domain_identity_mutation
        - treating_visual_output_as_evidence

    GodotOps:
      owns:
        - executable_runtime_host_ontology
        - SceneTree_lifecycle_discipline
        - Node_runtime_hosting
        - Resource_data_templates
        - Signal_event_propagation
        - ownership_vs_parenthood_distinction
      blocked_from:
        - simulation_claim_validation
        - evidence_state_promotion
        - causal_doctrine_override

    CE_OS:
      owns:
        - causal_accounting_order
        - interaction_definition
        - transfer_vs_propagation_distinction
        - mass_centric_vs_field_centric_distinction
        - scalar_compression_warning
      blocked_from:
        - overriding_Godot_runtime_semantics
        - validating_simulation_claims

  compression_lineage:
    source_material:
      - Grant_Simulation_Doctrine_raw
      - SimulationBridge_full_yaml
      - VisionOps_Phase1_Freeze
      - VisionOps_Phase1_Manifest
      - Phase2_Spine_Extraction
    recovery_rule: >
      VisionOps is the active compressed operational file. Long-form doctrine remains
      source/recovery material and must not be deleted or treated as unnecessary.

  doctrine_stack:
    domain_doctrine:
      rule: domains_are_interaction_organizations_not_substances
    participation_surface_doctrine:
      rule: shared_object_identity_does_not_imply_shared_domain_identity
    interaction_doctrine:
      rule: interactions_create_state_pressure_but_do_not_commit_state
    transition_doctrine:
      rule: continuous_equations_update_variables_transition_contracts_commit_regime_change
    scheduling_doctrine:
      rule: simulation_frames_are_sealed_causal_accounting_windows_not_render_frames
    evidence_doctrine:
      rule: simulation_outputs_remain_hypothesis_pressure_until_governance_review
    reconstruction_doctrine:
      rule: wrong_outputs_remain_useful_if_causal_lineage_is_preserved

  irreducible_primitives:
    Domain:
      definition: structured_interaction_organization
      rule: domains_are_not_substances
      examples:
        fluid_dynamic:
          classification: mass_centric
          grammar:
            - pressure
            - flow
            - viscosity
            - containment
            - displacement
            - leakage
            - fluid_momentum
        mechanical:
          classification: mass_centric
          grammar:
            - load
            - constraint
            - displacement
            - contact
            - deformation
            - inertia
            - friction
        electrical:
          classification: field_or_charge_centric
          grammar:
            - potential
            - current
            - impedance
            - charge_distribution
            - field_behavior
            - conduction

    InterfaceObject:
      definition: state_bearing_object_participating_in_multiple_domains_through_distinct_surfaces
      rule: object_identity_can_be_shared_without_domain_identity_being_shared
      prohibited_interpretations:
        - magical_converter
        - proof_of_domain_equivalence
        - scalar_translator_without_state_change

    ParticipationSurface:
      definition: domain_specific_surface_through_which_an_object_receives_or_emits_interaction_pressure
      required_fields:
        - surface_id
        - parent_object
        - domain
        - accepted_interactions
        - emitted_interactions
        - exposed_variables
        - constraints
        - losses
        - state_memory
        - measurement_points
        - evidence_state
        - prohibited_collapses

    InterfaceStateLink:
      definition: relation_where_state_change_at_one_surface_changes_conditions_at_another_surface
      rule: preserves_causal_lineage_without_domain_conversion
      required_fields:
        - source_surface
        - target_surface
        - source_domain
        - target_domain
        - transformed_state_condition
        - losses
        - delays
        - thresholds
        - unresolved_measurements

    InteractionEvent:
      definition: runtime_record_of_state_affecting_pressure
      rule: creates_pressure_not_committed_state
      required_fields:
        - event_id
        - frame_id
        - source_surface
        - target_surface
        - domain
        - interaction_type
        - pressure_terms
        - constraints
        - losses
        - evidence_state
        - unresolveds

    TransitionCandidate:
      definition: possible_regime_change_created_by_interaction_pressure
      outcomes:
        - commit
        - stall
        - reverse
        - accumulate
        - oscillate
        - fail
        - defer
      rule: threshold_crossing_does_not_equal_commitment

    TransitionContract:
      definition: rule_set_that_decides_when_pressure_becomes_committed_state_change
      contains:
        - source_state
        - target_state
        - threshold_conditions
        - commitment_conditions
        - blockers
        - reversal_conditions
        - timeout_conditions
        - hysteresis_rules
        - failure_conditions
        - recording_requirements

    TransitionArbiter:
      definition: deterministic_resolver_of_competing_transition_candidates
      rule: no_update_order_causality
      prohibited_behavior:
        - first_node_update_wins
        - arbitrary_order_commit
        - net_scalar_without_term_preservation

    SimulationFrame:
      definition: sealed_ordered_replayable_causal_accounting_window
      not_equivalent_to:
        - Godot_render_frame
        - _process_delta
        - _physics_process_delta

    RuntimeState:
      definition: published_committed_state_after_arbitration
      prohibited:
        - validation_claims
        - hidden_mutation
        - operational_readiness_claims

    ReconstructionLedger:
      definition: replayable_causal_history_for_diagnosis_and_recovery
      rule: failed_outputs_and_wrong_outputs_must_remain_recoverable

    EvidenceGate:
      definition: boundary_layer_blocking_claim_escalation
      blocks:
        - simulation_equals_validation
        - visual_output_equals_evidence
        - measurement_equals_validation
        - scalar_similarity_equals_equivalence

    GodotAdapter:
      definition: runtime_adapter_between_Godot_nodes_and_VisionOps_simulation_records
      rule: adapters_display_or_route_state_but_do_not_own_causal_truth

  shortest_execution_path:
    - MeasurementIngress
    - SnapshotSeal
    - InteractionEvaluation
    - PropagationWavefront
    - TransitionCandidateGeneration
    - TransitionArbitration
    - ChainValidation
    - AtomicCommitOrFailure
    - RuntimePublication
    - ReconstructionLog

  execution_chain:
    MeasurementIngress:
      purpose: collect_measurements_commands_and_external_events
      prohibited:
        - measurement_equals_validation
        - silent_assumption_overwrite

    SnapshotSeal:
      purpose: freeze_inputs_environment_object_state_and_system_state
      prohibited:
        - half_updated_reads
        - mutation_during_seal

    InteractionEvaluation:
      purpose: evaluate_interactions_against_sealed_snapshot
      prohibited:
        - direct_committed_state_mutation
        - hidden_transition_commit_inside_equation

    PropagationWavefront:
      purpose: propagate_pressure_across_declared_topology_with_loss_delay_and_cycle_detection
      prohibited:
        - unrecorded_global_influence
        - flattened_unexplained_influence_scalar

    TransitionCandidateGeneration:
      purpose: convert_pressure_records_into_possible_regime_changes
      prohibited:
        - threshold_crossing_equals_commitment

    TransitionArbitration:
      purpose: resolve_competing_candidates_deterministically
      prohibited:
        - object_update_order_as_causality
        - first_candidate_wins_without_contract

    ChainValidation:
      purpose: test_staged_commits_for_dependency_conflicts_before_publication
      prohibited:
        - publish_self_invalidating_transition_chain
        - erase_failed_chain_history

    AtomicCommitOrFailure:
      purpose: apply_accepted_commits_failures_holds_or_deferrals
      prohibited:
        - partial_unrecorded_mutation
        - commit_without_transition_record

    RuntimePublication:
      purpose: expose_new_committed_state_to_Godot_visual_and_inspection_layers
      prohibited:
        - visual_state_equals_evidence
        - runtime_state_equals_validation

    ReconstructionLog:
      purpose: preserve_frame_history_for_replay_diagnosis_and_recovery
      prohibited:
        - summarize_away_contradictions
        - hide_failed_transitions

  cross_domain_doctrine:
    core_statement: >
      Different domains remain causally interoperable because shared objects expose
      distinct participation surfaces whose state changes are legible to different
      interaction organizations. Domains do not directly convert into each other.

    required_chain:
      - Domain_A_interaction_event
      - ParticipationSurface_A_receives_pressure
      - InterfaceObject_state_change_or_transition_candidate
      - InterfaceStateLink_changes_conditions_at_Surface_B
      - Domain_B_interaction_event_or_transition_candidate

    preserved_across_handoff:
      - object_identity
      - causal_lineage
      - event_ordering
      - constraint_path
      - loss_visibility
      - measurement_provenance
      - evidence_state
      - unresolved_variables

    transformed_across_handoff:
      - boundary_condition
      - state_configuration
      - organized_capability
      - transition_eligibility
      - signal_form
      - storage_mode
      - usable_margin

    not_preserved_as_sameness:
      - domain_identity
      - mechanism_identity
      - variable_meaning
      - measurement_method
      - ontology
      - validation_state

  Godot_mapping:
    SceneTree:
      role: runtime_host_and_lifecycle_orchestration
      not_role: causal_truth_authority

    Node:
      role: visual_runtime_or_logical_adapter
      not_role: default_simulation_truth_owner

    Resource:
