          - impulse_candidate
          - head_or_load_candidate
        risks:
          - port_clogging
          - tubing_delay
          - pressure_wave_artifact
          - calibration_drift
          - thermal_effect
        blocked_claims:
          - pressure_signal_equals_load_validation
          - single_pressure_trace_equals_system_state

      acoustic_sensor:
        common_outputs:
          - sound_pressure_signal
          - spectral_candidate
          - event_candidate
        risks:
          - reflection
          - resonance
          - environmental_noise
          - microphone_placement_bias
          - filtering_artifact
        blocked_claims:
          - acoustic_event_equals_mechanical_cause
          - spectral_match_equals_validation

      thermal_sensor:
        common_outputs:
          - temperature_signal
          - thermal_image
          - heat_signature_candidate
        risks:
