      - preserved_causal_lineage
      - deterministic_transition_record
      - replayable_frame_history
      - no_validation_language

  unresolved:
    - exact_unit_typing_schema
    - dimensional_analysis_runtime_enforcement
    - conservation_accounting_templates
    - numerical_integrator_selection
    - identity_persistence_across_split_merge_repair_replay
    - approximation_admissibility_rules
    - ontology_failure_representation
    - Godot_resource_schema_for_primitives
    - first_minimal_scene_architecture

