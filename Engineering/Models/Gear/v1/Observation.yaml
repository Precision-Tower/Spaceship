  modality_registry:
    allowed_modalities:
      visual_camera:
        common_outputs:
          - image_frame
          - video_stream
          - optical_flow_candidate
          - visual_classification_candidate
        risks:
          - lighting_artifact
          - perspective_distortion
          - compression_artifact
          - frame_rate_aliasing
          - rolling_shutter
          - occlusion
          - interpretation_as_measurement
        blocked_claims:
          - image_shows_truth
          - visual_stability_equals_physical_stability

      human_observer:
        common_outputs:
          - witness_note
          - operator_annotation
          - qualitative_state_report
        risks:
          - expectation_bias
          - selective_attention
          - timing_uncertainty
          - scale_misjudgment
          - narrative_smoothing
        blocked_claims:
          - human_saw_it_so_it_is_confirmed
          - repeated_witnessing_equals_measurement

      accelerometer:
        common_outputs:
          - acceleration_signal
          - vibration_signal_candidate
          - motion_event_candidate
        risks:
          - mounting_stiffness_effect
          - sensor_mass_backreaction
          - axis_alignment_error
          - bandwidth_limit
          - aliasing
          - integration_drift
        blocked_claims:
          - acceleration_pattern_equals_causal_source
          - smooth_acceleration_equals_stability

      pressure_sensor:
        common_outputs:
