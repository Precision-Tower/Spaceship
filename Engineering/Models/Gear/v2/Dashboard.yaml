observed_current_state:
  launch_chain:
    - Run.py discovers Core from __file__.
    - Run.py launches Dashboard/UI/project.godot with Godot --path Dashboard/UI.
    - project.godot runs res://screen/scenes/Main.tscn.
    - Main.tscn attaches res://screen/scripts/Main.gd.
    - Main.gd builds the dashboard UI in _ready() via _background(), _build(), _seed().

  ui_layout:
    header:
      title: DashBoard
      subtitle_observed: operator cockpit ... operator-triggered state refresh
      banner: OBSERVATION_ONLY ... REFRESH != VALIDATION
    runtime_state_banner:
      initial_status: booted_not_refreshed
      visible_unknowns:
        - latest_diff: unknown
        - git_dirty: unknown
        - packets_pending: unknown
      boundary: runtime_state_reports_observation_only
    left_operator_surface:
      mission:
        default: open
      current_status:
        default: closed
        always_visible: true
        fields:
          - current_root
          - dashboard_boot
          - latest_diff
          - packets_pending
          - git_dirty
          - last_command
          - active_surface
          - next_required_action
      operator_observation:
        default: collapsed
      operational_awareness:
        default: collapsed
      command_history:
        default: collapsed
      runtime_boundaries:
        default: collapsed
    center_workspace_tabs:
      control_type: TabContainer
      seed_tabs:
        - Chat 01
        - Home
      screen_tabs_opened_by: _open_screen()
    bottom_runtime_surfaces:
      tabs:
        - Logs
        - Diffs
        - Packets
        - Terminal
      fullscreen_bottom_behavior: toggles bottom height only
    right_rail_modes:
      - directory
      - screens
      - commands

  screens:
    - Home
    - State
    - Agents
    - Packets
    - Diffs
    - Logs
    - Settings
    - AI Assist

  commands:
    buttons:
      top_control:
        - "+"
        - Refresh State
        - Test
        - Directory
        - Screens
        - Commands
      commands_panel:
        - Scan Core
        - Git Status
        - Propose Directory Diff
        - View Latest Diff
        - Review Latest Diff
        - Clear Latest Diff
        - List Packets
        - Create Packet Stub
        - Debug Paths
    map_grouping:
      observe_read_only:
        - scan Core
        - git status
        - list packets
      diff_proposal_review:
        - propose latest.diff
        - view latest.diff
        - review latest.diff
        - clear latest.diff
      packet_candidate:
        - create packet stub
      debug:
        - debug paths
    cli_registered:
      - scan-repo
      - git-status
      - propose-directory-diff
      - grant-review
      - apply-patch
      - runtime-state
      - test-all
      - view-latest-diff
      - grant-review-latest-diff
      - clear-latest-diff
      - list-packets
      - create-packet
    ui_wrapper_commands:
      - runtime-state
      - test-all
      - scan-repo
      - git-status
      - propose-directory-diff
      - view-latest-diff
      - grant-review-latest-diff
      - clear-latest-diff
      - list-packets
      - create-packet
    cli_ui_mismatch_explicit:
      observed: false
      registered_in_ui_not_dashboard_cli: []

  runtime_surfaces:
    - Logs
    - Diffs
    - Packets
    - Terminal

  observation_operator_tracking_behavior:
    persistence: false
    reset_on_app_restart: true
    tracked:
      - explicit button clicks
      - panel toggle counts
      - panel open/closed state
      - surface visits
      - recent routes
      - not_observed_this_session
      - last operator event
    caps:
      max_rendered_lines: 12
      recent_routes_max: 5
      not_observed_this_session_max: 4
    boot_seed_excluded_from_observed_actions:
      - Chat 01
      - Home

  ai_assist_current_status:
    present_in_screens_list: true
    implementation: static_tab_only
    displayed_text:
      - AI Assist surface pending wiring
      - not connected
      - no API calls
      - manual context only
      - assist_output != authority
      - model_status=unknown
    no_ai_implementation_observed: true

  explicit_boundaries_and_warnings_displayed:
    - OBSERVATION_ONLY ... REFRESH != VALIDATION
    - status != validation
    - runtime_state_reports_observation_only
    - observation != interpretation
    - history != evidence
    - display != authority
    - collapsed_panel != inactive_authority
    - refresh != readiness
    - proposal != patch
    - focus != authority
    - green_status != safe
    - compact_display != completeness
    - assist_output != authority
    - model_status=unknown

  known_unknowns_still_visible:
    - latest_diff: unknown
    - git_dirty: unknown
    - packets_pending: unknown
    - model_status=unknown

  command_execution_boundaries:
    observed:
      - Godot UI calls CliBridge.run_cli() through static wrappers.
      - CliBridge executes python dashboard_cli.py <command>.
      - dashboard_cli.py registers scan-repo, git-status, propose-directory-diff, grant-review, and apply-patch.
      - propose-directory-diff writes Dashboard/UI/scripts/patches/latest.diff if executed.
    inferred_from_parser_mismatch:
      - UI wrapper commands absent from dashboard_cli.py will not resolve through the current parser.

  dashboard_runtime_snapshot:
    refresh_state_route_verified:
      - Refresh State button
      - Main.gd
      - CliBridge.gd
      - dashboard_cli.py
      - commands/runtime_state.py
    refresh_state_status:
      wired: true
      boot_tested: true
      observed_updating_runtime_state_banner: true
      observed_updating_current_status: true
      observed_writing_terminal_output: true
      not_validation: true
    mission_panel_status:
      mission_yaml_backed_display_added: true
      left_panel_accordion_added: true
      mission_open_by_default: true
      other_sections_collapsed_by_default: true
      mission_parsing_imperfect: true
    current_known_issue:
      - Mission task parser currently renders task YAML incorrectly, e.g. "[ ] status: complete" instead of task label/status.
    current_next_action: Fix Mission parser/rendering.
    boundary:
      - Dashboard remains observation/runtime surface only.
      - Refresh success is not validation.
      - Mission display is operator orchestration, not authority.

  mission_runtime_state:
    mission_file: Core/Dashboard/UI/Mission.yaml
    render_location:
      script: Main.gd
      surface: left_operator_surface
    default_state:
      mission: open
      current_status: closed
      operator_observation: closed
      operational_awareness: closed
      command_history: closed
      runtime_boundaries: closed
    current_verified_screenshot_state:
      dashboard_boots: true
      mission_visible: true
      accordion_behavior_confirmed: true
      refresh_state_button_observed_working: true
      current_visual_issue: >
        Mission task rendering currently displays YAML field text
        instead of task labels and status markers.
    next_agent_instruction:
      immediate_task: Fix Mission parser/rendering only
    do_not_touch:
      - layout
      - Refresh State
      - CLI
      - Mission accordion behavior
      - Dashboard.yaml structure
      - Mission.yaml unless parser validation requires it

  no_persistence_boundaries:
    observed:
      - Main UI state is in-memory.
      - operator observation is in-memory.
      - command history is in-memory.
      - chat text is not saved by observed UI code.
    present_but_not_observed_as_active_ui_path:
      - state_manager.py can save sessions.

fragile_surfaces:
  - CliBridge._python_command() is hardcoded to python.
  - UI exposes commands not registered by dashboard_cli.py.
  - right rail directory tree is static and may drift from filesystem.
  - AI Assist is not currently listed in OBSERVATION_SURFACES, so it may not appear under not_observed_this_session.
  - command buttons can run real CLI effects; propose-directory-diff can create or update latest.diff.
  - most UI topology is concentrated in Main.gd.

rollback_sensitive_files:
  - Dashboard/UI/screen/scripts/Main.gd
  - Dashboard/UI/screen/scripts/runtime/CliBridge.gd
  - Run.py
  - Dashboard/UI/project.godot
  - Dashboard/UI/screen/scenes/Main.tscn
  - Dashboard/UI/scripts/cli/dashboard_cli.py

