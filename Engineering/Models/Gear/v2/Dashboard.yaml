    statement: >
      The project is transitioning from Dashboard-as-tool toward Cali Runtime v1.
      Dashboard is one surface, CLI is one surface, and future voice/desktop control may become another surface.
      Cali identity should remain portable through the agent registry rather than being trapped inside one UI.
    layers:
