Directory:
  file: Directory.yaml
  role: living_repository_routing_structure_and_human_limitation_map
  status: active_living_map
  authority: navigation_only_not_canon

  prime_directive: >
    Directory.yaml exists because Seth is human. The repository must remain
    visible, bounded, and survivable to operate. Perfect abstraction loses if
    Seth cannot hold the structure in working memory.

  human_restraints:
    operator: Seth
    core_problem: human_navigation_collapse_under_context_sprawl

    constraints:
      - too_many_active_files_causes_operational_chaos
      - duplicate_names_with_unclear_purpose_cause_cognitive_collision
      - hidden_authority_routes_create_overload
      - archive_material_can_overwhelm_active_work_if_not_contained
      - summaries_can_become_false_authority_when_source_paths_are_hidden
      - perfect_normalization_can_destroy_human_readability

    design_priority_order:
      - human_survivability
      - readable_topology
      - authority_lane_visibility
      - reconstructability
      - model_efficiency
      - theoretical_elegance

    hard_limits:
      model_active_file_limit: 20
      rule: each_model_lane_may_hold_no_more_than_20_active_files_at_once
      reason: preserve_Seth_navigation_and_operational_control

    file_count_rules:
      Shared_files:
        count_against_model_limit: false
        reason: Shared_files_are_common_context_known_by_all_models

      model_local_files:
        count_against_model_limit: true
        reason: model_local_files_are_active_lane_loadout

      Archive_files:
        count_against_model_limit: false
        reason: Archive_is_recovery_lineage_not_active_model_loadout

      Tools:
        count_against_model_limit: false
        reason: tools_are_external_support_not_model_context

    overload_signal:
      - model_requires_more_than_20_files
