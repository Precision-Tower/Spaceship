symbolic_syntax:
  Keyboard-first design:
    You shouldn't need a physics textbook, just your keys.
    Semantic resolution, not syntactic perfection
    If the system knows what Battery(ps;12v) means, then Battery;ps;12v or even Battery(ps) followed by a value in the chain still works.
    Chicken scratch is valid
    You’re not solving equations—you’re mapping causal events. The AI interpreter should read your shorthand, not ask you to conform.
  "=":
    name: causal_resolution_operator
    role: >
      Represents a resolution event. Indicates that the output displacement (d)
      of the component on the left becomes the input potential (p) of the
      component on the right. This symbol marks a boundary between resolved
      and new causal states.
    directionality: left_to_right
    restriction: >
      Cannot be used to express equivalence, identity, or balance.
      It must always represent a resolved output becoming a causal input.
    example: Battery(ps) = Motor(me)
    meaning: >
      The battery’s stored potential resolves into mechanical energy
      in the motor. This does not mean Battery == Motor. It means:
      ps (from Battery) → d → p (of Motor).
  "()":
    name: component_shell
    role: >
      Encapsulates a system or unit. All internal terms belong to a single causal component 
      in the kinetic chain. May include inputs, internal structure, or outputs.
    example: Battery(ps:p:10a/hr;12v)

  "{}":
    name: potential_instance
    role: >
      Denotes a specific instance of a component, including its current state and attributes.
      Used to differentiate between multiple instances of the same component type.
    example: Fire{EMW}{TE}{FD} → Fire with specific electromagnetic, thermal, and ambient fluid momentum attributes

  ":":
    name: scope_or_type_cast
    role: >
      Specifies causal roles and sub-categories. Casts values into causal domains or types
      such as potential (p), stored potential (ps), fluid pressure (psi), etc.
    formats:
      - ps: → Stored Potential
      - p: → Potential
      - me: → Mechanical Energy
    example: ps:p:10a/hr → StoredPotential:Potential:Rate

  ";":
    name: attribute_separator
    role: >
      Separates multiple parameters or attributes within the same causal scope.
      Allows bundling of multiple values for a single field or component.
    example: Battery(ps:p:10a/hr;12v) → Current and Voltage under stored potential

  "/":
    name: structure_separator
    role: >
      Defines internal transitions within a component, typically used for design architecture:
      input → design → output. Each section may hold a full set of causal subterms.
    example: Turbine(input/design/output)

component_structure:
  format: "<ComponentName>(<CausalType>:<Term>:<Value;...>)"
  description: >
    A component is a symbolic causal object. Each is self-contained and can hold
    potential (p), resistance (r), displacement (d), or higher-level types (ps, px, hp, etc.).
  examples:
    - name: battery_simple
      code: Battery(ps;p:10a/hr;12v)
      meaning: A battery storing potential at 10 amps/hour and 12 volts.

    - name: turbine_full
      code: Turbine(input:ap:100psi;hp:1500rpm/design:px:torque:200ft-lb/output:px:me:40kw)
      meaning: >
        A turbine receiving air and hydraulic pressure, converting it via a torque-based
        design into mechanical output energy.

field_prefixes:
  EMW: Electromagnetic Wave Field
  TE: Thermal Field
  FD: Fluidic Domain
  ME: Mechanical Domain
  FC: Field-Centric (generic)
  MC: Mass-Centric (generic)
  EC: Electrical Conduction

core_terms:
  p: Potential
  r: Resistance
  d: Displacement
  ps: Stored Potential
  px: Propagating Potential (design structure)
  ap: Air Pressure
  hp: Hydraulic Pressure
  me: Mechanical Energy
