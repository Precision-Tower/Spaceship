Mass-centric Systems(MC):
  - Mechanical Energy(ME):
      The relationship between potential and displacement as expressed through the motion or configuration of mass. It manifests as linear (translational) or angular (rotational) motion.
    Linear Mechanical Energy (ML):
      The relationship between potential (e.g., applied Force) and displacement (linear motion) of a mass against resistance.
    Angular Mechanical Energy (MA):
      The relationship between potential (e.g., Torque) and displacement (rotational motion) of a mass around an axis against resistance.
  - Fluid Dynamic(FD):
      The relationship between potential and displacement as expressed through the motion or configuration of fluids. It manifests as pressure, flow rate, and buoyancy.
    Ambient Fluid Energy (FA):
      The relationship between fluid potential (e.g., fluid momentum) and linear displacement (flow rate) of a fluid against resistance, in an ambient environment.
    Pneumatic Energy (FP):
      The relationship between potential (e.g., compressed gas pressure) and displacement (expansion or force) of a gas against resistance.
    Hydraulic Energy (FH):
      The relationship between potential (e.g., liquid pressure) and displacement (flow or mechanical work) of a liquid against resistance.
    Buoyancy (Bc):
      The relationship between potential (e.g., Density difference) and displacement (buoyancy force) of a fluid in a fluid environment against resistance.
Field-centric Systems(FC):
  - Magnetic Field Potential(Fx):
      The relationship between potential and displacement as expressed through the motion or configuration of magnetic fields.
  - Electricity (Ec):
      The relationship of potential through the displacement as expressed through the resolution of magnetic fields.
    Alternating Current(AC):
      The relationship between potential (e.g., Voltage) and displacement (electric field lines) of a charge against resistance in an alternating current system.
    Direct Current(DC):
      The relationship between potential (e.g., Voltage) and displacement (electric field lines) of a charge against resistance in a direct current system.
  - Electromagnetic Wave (EMW):
      The relationship of potential through the displacement as expressed through the resolution of electromagnetic waves.
  - Thermodynamics(TE):
      The relationship of potential through the displacement as expressed through the resolution of thermal energy.

