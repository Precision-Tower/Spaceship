mass_centric_systems:
  - name: Mechanical Energy
    symbol: ME
    equation: pm-r=dm
    description: The relationship between potential and displacement as expressed through the motion or configuration of mass. It manifests as linear (translational) or angular (rotational) motion.
    terms: Momentum(f)
    subcategories:
      - name: Linear Mechanical Energy
        symbol: ML
        description: The relationship between potential (e.g., applied Force) and displacement (linear motion) of a mass against resistance.
        terms: Velocity(v)
      - name: Angular Mechanical Energy
        symbol: MA
        description: The relationship between potential (e.g., Torque) and displacement (rotational motion) of a mass around an axis against resistance.
        terms: Torque(T), Angular Velocity(ω)
  - name: Fluid Energy
    symbol: FE
    equation: px-r=dx
    description: The relationship between potential and displacement as expressed through the motion or configuration of fluids. It manifests as pressure, flow rate, and buoyancy.
    terms: Momentum(f)
    subcategories:
      - name: Ambient Fluid Energy
        symbol: FA
        description: The relationship between fluid potential (e.g., fluid momentum) and linear displacement (flow rate) of a fluid against resistance, in an ambient environment.
      - name: Pneumatic Energy
        symbol: FP
        description: The relationship between potential (e.g., compressed gas pressure) and displacement (expansion or force) of a gas against resistance.
      - name: Hydraulic Energy
        symbol: FH
        description: The relationship between potential (e.g., liquid pressure) and displacement (flow or mechanical work) of a liquid against resistance.
      - name: Buoyancy
        symbol: Bc
        description: The relationship between potential (e.g., Density difference) and displacement (buoyancy force) of a fluid in a gravitational field against resistance.
