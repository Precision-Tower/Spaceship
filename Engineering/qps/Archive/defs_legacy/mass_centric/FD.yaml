Fluid Dyanamics:
  definition: |
    Fluid Dynamics refers to the aspects of mass-centric systems that involve fluid dynamics.
    It encompasses the principles of pressure, flow, and buoyancy.
    A fluid is a mass that changes shape based on containment.
  Viscosity(vc):
    definition: |
      Viscosity is the internal resistance of a fluid to displacement.
      It measures how much a fluid resists motion between adjacent layers under stress.
      Causally:
      - Viscosity is the fluidic equivalent of friction in mass systems
      - It expresses the resistance (r) that impedes flow (displacement)
      - A high-viscosity fluid (e.g. oil) resists flow more than a low-viscosity fluid (e.g. water or air)
      Domain Implication:
      - Viscosity defines whether a fluid behaves more like a liquid or a gas
        > High viscosity → liquid-like (cohesive displacement, slower flow)
        > Low viscosity → gas-like (diffuse displacement, faster flow)
      In KE terms:
      - Viscosity is the resistance (r) in the fluidic equation:
        p - vc = d
      - It determines how much potential (pressure) is required to sustain flow (displacement) through the medium
      Viscosity is not a material property alone — it is a causal modifier that determines whether energy in a fluid system becomes motion or is absorbed internally.
  Fluid_Mass(mf):
    definition: |
      Fluid mass (mf) is the measurable resistance to displacement caused by the quantity of matter within a given volume of fluid.
      Causally:
      - Fluid mass is the inertial component of a fluid — it governs how much force is required to initiate or sustain flow
      - It does not define viscosity or cohesion, but how much momentum a volume of fluid can store or carry
      - It is typically expressed as mass density (ρ = mass / volume), but in KE modeling, it defines the inertial term in fluidic motion
      In KE terms:
      - Fluid mass determines the “inertia” in a fluid system
      - It is the opposing quantity to acceleration or pressure change
      - It must be overcome by pressure potential (p) in order to achieve displacement (d)
      - Displacement resolves as momentum (f)
      Example:
      - Water and air can both flow, but water has a significantly higher fluid mass than air
      - This means more pressure is needed to displace the same volume of water at the same rate
      Fluid mass is not a static property — it dynamically interacts with pressure and viscosity to define the full resistance (r) in fluidic systems.
  Flow_Rate(gpm, l/s, Q):
    definition: |
      The volumetric rate of fluid displacement; it measures the volume of fluid passing through a given cross-sectional area per unit of time.
      Flow Rate is a direct expression of resolved potential (pressure) into fluid motion (displacement).
      Q = Area × Velocity = A × v
      It represents the instantaneous rate of causal resolution in a fluid system.
  Fluid_Momentum(pf):
    definition: |
      Fluid momentum is the causal memory of resolved pressure within a fluid mass as it undergoes displacement.

      Causality:
      - Momentum in a fluid system is not inherent — it is generated by the application of potential (p) overcoming resistance (r), resulting in sustained displacement (d).
      - It is the fluidic equivalent of linear momentum (f = m·v), applied across a continuous volume rather than a rigid body.
      - It expresses the stored causal influence of pressure or force once flow is established.
      - Fluid momentum is directional and persistent — once initiated, it sustains unless acted upon by opposing resistance (viscosity, drag, geometry).

      In KE terms:
      - Fluid momentum is defined by:
          fₘ = m · v
          where:
            m = fluid mass in motion
            v = velocity of flow (displacement rate)
      - The causal equation becomes:
          (p - r) → d → fₘ
        - Pressure initiates potential
        - Resistance filters it
        - Displacement creates flow
        - Momentum stores the result

      Implications:
      - Fluid momentum explains how energy is transferred downstream through pipework, nozzles, or exchangers.
      - It enables feedback systems: e.g., water hammer is uncontrolled fluid momentum meeting resistance.
      - It bridges kinetic models between fluid and mechanical systems — e.g., turbines, hydraulic rams, jet propulsion.

      Summary:
      - Fluid momentum is not pressure — it is the motion that results from it.
      - It is sustained energy in flow form, caused by the resolution of causal pressure.
      - It allows fluid systems to exhibit inertia and kinetic continuity, just like solid masses.
  Hydraulic_Pressure(ph):
    definition: |
      Hydraulic pressure is the internal field tension created by compressive displacement within an incompressible fluid.
      It arises not from friction, but from electromagnetic cohesion, thermodynamic reactivity, and structural constraint.
      Causally:
      - Hydraulic pressure is not externally applied — it is generated by the system’s inability to displace volume fast enough to resolve potential
      - As pressure builds, molecular alignment becomes tighter, causing localized field tension and thermal reactivity
      - This reactivity causes expansion, which feeds back into the system as amplified pressure
      - Not only does the expansion inside of the pressurized vessel increase force, but so does the accumulation of momentum
      - The pressure is the result of unresolved potential (p) against structural resistance (r), leading to internal displacement (d) that is accumulative
      - Just like a flywheel, the pressure builds up until it is released
      - The pressure is not a loss of energy, but a buildup of potential that seeks to resolve as displacement
      - The accumulation of force is what we call pressure
      - The pressure increases fluid velocity as potential
      In KE terms:
      - Hydraulic pressure is potential trapped in a high-resistance fluid path
      - It expresses the failure of p to become d, resulting in internal buildup
      - Resistance here is not mechanical friction, but field-based constraint and molecular resistance to compression
      Thermal Clause:
      - As compression increases, so does thermo-reactivity
      - Expansion at the molecular level contributes to increased reactive force
      - Pressure in hydraulics is a dynamic balance of input potential and constrained volumetric expansion
      Summary:
      - Hydraulic pressure is fluid force expressed as a consequence of unresolved causal tension
      - It is not frictional loss — it is potential seeking displacement but encountering energetic confinement
  Pneumatic_Pressure(px):
    definition: |
      Pneumatic pressure is the causal potential stored within a compressible fluid (gas) due to structured volume confinement and external displacement input.

      Causality:
      - Pneumatics differ from hydraulics in that gases are inherently compressible, due to low electromagnetic cohesion.
      - The molecules in a gas are loosely bound, allowing field structure to deform and store displacement as potential.
      - When compressed, the gas expresses resistance not through direct molecular force, but through field expansion tension — the system seeks equilibrium.
      - This creates storable causal tension — potential energy maintained by confinement, waiting to resolve as displacement when resistance is removed.
      In KE terms:
      - Pneumatic pressure is stored potential (pₛ) within a compressible medium.
      - It is defined relative to containment:
          pp = pₛ / v
          where:
            pₛ = stored potential
            v  = volume of containment (resistance)
      - The causal expression:
          (pₛ - r) = d
        where:
          r = resistance from volumetric constraint and cohesion threshold
      Implications:
      - Pneumatics are storage-first systems — they accumulate potential that expresses as expansive displacement.
      - Unlike hydraulics (which push), pneumatics expand.
      - The mass of the gas contributes less to inertial resistance than the field gradient created by compression.
      - Once released, pneumatic systems express force as momentum:
          f = m · v
          where:
            m = fluid mass displaced
            v = velocity of expanding gas
      Thermal Clause:
      - Compression increases temperature, aligning with the Thermal Genesis axiom.
      - Thermal agitation increases internal energy without increasing mass.
      - Pneumatic systems heat under compression and cool upon expansion — a direct signature of causal tension and kinetic resolution.
      Summary:
      - Hydraulic: pressure from incompressible cohesion, dynamic but not storable.
      - Pneumatic: pressure from compressible field variance, storable and expansive.

  Refrigerant(fg):
    definition: |
      A refrigerant is a phase-active fluid that stores and releases causal potential through thermally-driven compression and expansion cycles.

      Causality:
      - Refrigerants are compressible fluids that undergo controlled phase changes to absorb and release thermal energy.
      - Their behavior is fluidic — defined by displacement, volume, resistance, and pressure — but modified by thermal reactivity.
      - The refrigerant operates in a closed system where pressure (p), resistance (r), and displacement (d) interact cyclically:
          - Compression increases pressure (p) and temperature (thermal potential).
          - Expansion reduces pressure, allowing thermal displacement (cooling effect).
          - Phase change (liquid ⇄ gas) represents a transition in internal field tension — not a loss, but a reorganization of potential.

      In KE terms:
      - Refrigerants model p - r = d in thermally active fluid systems.
      - The resistance (r) includes:
          - Volumetric confinement
          - Phase inertia
          - Flow friction
      - Displacement (d) occurs as:
          - Mass flow through a circuit
          - Latent heat absorption/release
          - Temperature differential across exchangers
      - Stored potential exists in both pressure and phase configuration.

      Thermal Clause:
      - Refrigerants uniquely operate through thermal reactivity — heat is not lost or conserved, but resolved as causal displacement.
      - As temperature changes, so does internal field geometry, modifying the system’s ability to absorb or reject energy.
      - Refrigerants link directly to the Thermal Genesis axiom: field transformation via heat initiates structural change.

      Summary:
      - A refrigerant is a causally reactive, thermally modulated fluid.
      - Its energy is stored as compressive field tension and released through phase displacement.
      - It is fluidic in motion, but thermal in effect — a bridge between fluid mechanics and thermodynamic causality.