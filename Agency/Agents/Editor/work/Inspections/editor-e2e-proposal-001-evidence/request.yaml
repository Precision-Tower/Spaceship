RepositoryContextRequest:
  request_id: editor-e2e-proposal-001-evidence
  objective: Replace one deterministic string in the Editor README.
  include:
  - Agency/Agents/Editor/README.md
  exclude: []
  operations:
  - text_search
  symbols: []
  text:
  - EditorTask
  paths:
  - Agency/Agents/Editor/README.md
